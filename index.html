<script>
const $ = s => document.querySelector(s);
const S = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const W = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const SP = {
  NFL:   { k: 'americanfootball_nfl', e: 'football/nfl', label: 'NFL' },
  NCAAF: { k: 'americanfootball_ncaaf', e: 'football/college-football', g: 80, label: 'College Football' },
  NCAAB: { k: 'basketball_ncaab', e: 'basketball/mens-college-basketball', g: 50, label: 'College Hoops' },
  NHL:   { k: 'icehockey_nhl', e: 'hockey/nhl', label: 'NHL' },
  MLB:   { k: 'baseball_mlb', e: 'baseball/mlb', label: 'MLB' }
};

const BK = ['DK', 'FD', 'MGM'];
const BN = { draftkings: 'DK', fanduel: 'FD', betmgm: 'MGM' };
const POW = ['SEC', 'Big Ten', 'Big 12', 'ACC', 'Big East'];
const CF = {
  NCAAF: { 1:'ACC', 4:'Big 12', 5:'Big Ten', 8:'SEC', 9:'Pac-12', 12:'C-USA', 15:'MAC', 17:'MWC', 37:'Sun Belt', 151:'AAC', 18:'Ind' },
  NCAAB: { 2:'ACC', 3:'A-10', 4:'Big East', 7:'Big Ten', 8:'Big 12', 23:'SEC', 9:'Pac-12', 46:'WCC' }
};

let st = {
  tab: 'All',
  onlyStrong: false,
  rank: false,
  power: false,
  openOdds: {},
  view: 'board',
  games: [],
  err: [],
  cfg: S('gp_cfg', { key: '', on: { NFL: 1, NCAAF: 1, NCAAB: 1, NHL: 1, MLB: 0 }, unit: 25 }),
  bets: S('gp_bets', []),
  rem: S('gp_rem', null)
};
let chart;

const dec = o => o > 0 ? 1 + o / 100 : 1 + 100 / -o;
const fm = o => o == null ? '–' : o > 0 ? '+' + o : '' + o;
const ln = n => n > 0 ? '+' + n : '' + n;

async function cached(k, fn, ttl = 9e5) {
  const c = S('gp_c_' + k, null);
  if (c && Date.now() - c.t < ttl) return c.d;
  const d = await fn();
  W('gp_c_' + k, { t: Date.now(), d });
  return d;
}

/* ---------- SAMPLE SLATE (SHOWN BEFORE API KEY IS ENTERED) ---------- */

  const samples = [

      e: {
        st: 'Sun 1:00 PM', state: 'pre', venue: 'M&T Bank Stadium', indoor: false, weather: 'Clear', temp: 44,
        a: { short: 'Jets', rec: '3-7', split: '1-4', standings: { ppg: 18.2, papg: 24.6 }, leaders: ['B. Hall (780 Rush Yds)'] },

      }

      e: {

      books: { DK: { ml: [-190, 158], sp: [4.5, -110, -110], t: [54.5, -110, -110] }, MGM: { ml: [-185, 155], sp: [4.5, -110, -110], t: [54.5, -110, -110] } },
      e: {
        st: 'Sat 12:00 PM', state: 'pre', venue: 'Ben Hill Griffin Stadium', indoor: false, weather: 'Sunny', temp: 68,
        a: { short: 'Ole Miss', rec: '8-2', split: '2-2', standings: {}, leaders: ['J. Dart (3,100 Pass Yds)'] },

      }
    },
    {

      tm: 'Tonight 7:00 PM', sample: true,

        h: { short: 'Hurricanes', rec: '13-5-0', split: '7-2-0', standings: { ppg: 3.6, papg: 2.5 }, leaders: ['M. Necas (27 PTS)'] }

/* ---------- FETCH ODDS ---------- */
async function oddsFetch(sp) {
  const u = `https://api.the-odds-api.com/v4/sports/${SP[sp].k}/odds/?apiKey=${encodeURIComponent(st.cfg.key)}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm`;
  const res = await fetch(u);
  if (!res.ok) {
    if (res.status === 401) throw new Error('Invalid API Key — check Settings.');
    if (res.status === 429) throw new Error('Odds API rate limit or out of credits.');
    throw new Error(`${sp}: Odds API Error ${res.status}`);
  }
  const rm = res.headers.get('x-requests-remaining');
  if (rm != null) { st.rem = rm; W('gp_rem', rm); }
  const j = await res.json();
  return j.map(e => {
    const g = {
      id: e.id,
      s: sp,
      a: e.away_team,
      h: e.home_team,
      ts: e.commence_time,
      tm: new Date(e.commence_time).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
      books: {}
    };
    e.bookmakers.forEach(b => {
      const n = BN[b.key];
      if (!n) return;
      const o = {};
      b.markets.forEach(m => {
        const A = m.outcomes.find(x => x.name === e.away_team);
        const H = m.outcomes.find(x => x.name === e.home_team);
        if (m.key === 'h2h' && A && H) o.ml = [A.price, H.price];
        if (m.key === 'spreads' && A && H) o.sp = [H.point, A.price, H.price];
        if (m.key === 'totals') {
          const ov = m.outcomes.find(x => x.name === 'Over');
          const un = m.outcomes.find(x => x.name === 'Under');
          if (ov && un) o.t = [ov.point, ov.price, un.price];
        }
      });
      g.books[n] = o;
    });
    return g;
  });
}

/* ---------- FETCH ESPN SCOREBOARD + TEAM STATS ---------- */
async function espnFetch(sp) {
  const c = SP[sp];
  return cached('espn_' + sp, async () => {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${c.e}/scoreboard?limit=300` + (c.g ? `&groups=${c.g}` : ''));
    const j = await res.json();
    return (j.events || []).map(ev => {
      const comp = ev.competitions[0];
      const cp = comp.competitors;
      const parseTeam = side => {
        const q = cp.find(x => x.homeAway === side);
        const t = q.team;
        const recs = q.records || [];
        const overall = (recs.find(r => r.type === 'total') || recs[0] || {}).summary || '';
        const split = (recs.find(r => r.type === (side === 'home' ? 'home' : 'road')) || {}).summary || '';
        const leaders = (q.leaders || []).slice(0, 2).map(l =>
          `${l.shortDisplayName}: ${l.leaders?.[0]?.athlete?.shortName} (${l.leaders?.[0]?.displayValue})`
        );
        return {
          id: t.id,
          n: t.displayName,
          short: t.shortDisplayName || t.name,
          loc: t.location || '',
          logo: t.logo,
          sc: q.score,
          cf: t.conferenceId,
          rk: q.curatedRank && q.curatedRank.current > 0 && q.curatedRank.current <= 25 ? q.curatedRank.current : null,
          rec: overall,
          split,
          leaders
        };
      };
      return {
        h: parseTeam('home'),
        a: parseTeam('away'),
        st: ev.status.type.shortDetail,
        state: ev.status.type.state,
        venue: comp.venue?.fullName || '',
        indoor: comp.venue?.indoor ?? false,
        weather: ev.weather?.displayValue || '',
        temp: ev.weather?.temperature || null
      };
    });
  }, 6e5);
}

/* ---------- FETCH ESPN STANDINGS (PPG / PAPG) ---------- */
async function standingsFetch(sp) {
  const c = SP[sp];
  return cached('stand_' + sp, async () => {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/v2/sports/${c.e}/standings`);
      const j = await res.json();
      const map = {};
      const walk = node => {
        if (node.standings?.entries) {
          node.standings.entries.forEach(ent => {
            const id = ent.team?.id;
            if (!id) return;
            const stMap = {};
            (ent.stats || []).forEach(s => { stMap[s.name] = s.value; });
            map[id] = {
              ppg: stMap.avgPointsFor ?? stMap.pointsFor ?? null,
              papg: stMap.avgPointsAgainst ?? stMap.pointsAgainst ?? null
            };
          });
        }
        (node.children || []).forEach(walk);
      };
      walk(j);
      return map;
    } catch {
      return {};
    }
  }, 18e5);
}

const AL = {
  uconn: 'connecticut', 'ole miss': 'mississippi', usc: 'southern california', pitt: 'pittsburgh',
  umass: 'massachusetts', ucf: 'central florida', smu: 'southern methodist', tcu: 'texas christian',
  byu: 'brigham young', unlv: 'nevada las vegas', lsu: 'louisiana state', vcu: 'virginia commonwealth',
  'miami fl': 'miami', 'miami (fl)': 'miami', saint: 'st', 'st.': 'st'
};
const nz = s => {
  s = (s || '').toLowerCase().replace(/[’']/g, '').replace(/[.&]/g, m => m === '.' ? '' : ' ').replace(/[()-]/g, ' ');
  for (const k in AL) s = s.replace(new RegExp('\\b' + k.replace(/[.()]/g, '') + '\\b', 'g'), AL[k]);
  return s.replace(/\bstate\b/g, 'st').replace(/\bsaint\b/g, 'st').replace(/\s+/g, ' ').trim();
};
const sim = (a, t) => {
  const A = nz(a).split(' '), B = nz(t.n).split(' ');
  const i = A.filter(x => B.includes(x)).length;
  const s1 = i / Math.max(A.length, B.length);
  const L = nz(t.loc);
  return Math.max(s1, L && nz(a).startsWith(L) ? .9 : 0);
};

function parseRec(r) {
  if (!r) return null;
  const p = r.split('-').map(Number);
  if (p.length < 2 || isNaN(p[0]) || isNaN(p[1])) return null;
  const tot = p[0] + p[1] + (p[2] || 0);
  return { w: p[0], l: p[1], pct: tot ? p[0] / tot : 0, gp: tot };
}

function bestLine(books, market, side) {
  let best = null;
  for (const b of BK) {
    const v = books[b];
    if (!v) continue;
    if (market === 'ml' && v.ml) {
      const odds = v.ml[side === 'a' ? 0 : 1];
      if (!best || dec(odds) > dec(best.odds)) best = { book: b, odds, point: null };
    }
    if (market === 'sp' && v.sp) {
      const point = side === 'a' ? -v.sp[0] : v.sp[0];
      const odds = v.sp[side === 'a' ? 1 : 2];
      const score = point * 10 + dec(odds);
      if (!best || score > best.score) best = { book: b, odds, point, score };
    }
    if (market === 't' && v.t) {
      const point = v.t[0];
      const odds = v.t[side === 'o' ? 1 : 2];
      const score = (side === 'o' ? -point : point) * 10 + dec(odds);
      if (!best || score > best.score) best = { book: b, odds, point, score };
    }
  }
  return best;
}

/* ---------- DECISION ENGINE: WHAT TO PICK & WHY ---------- */
function generateRecommendation(g) {
  const e = g.e;
  const firstBook = Object.values(g.books)[0] || {};
  const homeSpread = firstBook.sp ? firstBook.sp[0] : null;
  const total = firstBook.t ? firstBook.t[0] : null;

  if (!e) {
    const fallback = bestLine(g.books, 'ml', 'h');
    return {
      tier: 'pass',
      score: 0,
      tierLabel: 'LIMITED DATA',
      pickTitle: 'No Automated Pick — Matchup Data Pending',
      reason: 'Live odds are loaded, but team records and matchup stats have not synced for this game yet.',
      bet: fallback ? { market: 'ml', side: 'h', label: `${g.h} ML`, ...fallback } : null
    };
  }

  const aRec = parseRec(e.a.rec);
  const hRec = parseRec(e.h.rec);
  const aRoad = parseRec(e.a.split);
  const hHome = parseRec(e.h.split);
  const aSt = e.a.standings || {};
  const hSt = e.h.standings || {};

  let homeScore = 0;
  let awayScore = 0;
  let overScore = 0;
  let underScore = 0;
  const homeReasons = [];
  const awayReasons = [];
  const totalReasons = [];

  // 1. Season Win% Gap
  if (aRec && hRec && aRec.gp >= 3 && hRec.gp >= 3) {
    const pctGap = hRec.pct - aRec.pct;
    if (pctGap >= 0.22) {
      homeScore += 2.5;
      homeReasons.push(`${e.h.short} (${e.h.rec}) has been noticeably stronger all season than ${e.a.short} (${e.a.rec})`);
    } else if (pctGap <= -0.22) {
      awayScore += 2.5;
      awayReasons.push(`${e.a.short} (${e.a.rec}) owns a clear record advantage over ${e.h.short} (${e.h.rec})`);
    }
  }

  // 2. Home Dominance vs Road Struggles
  if (hHome && hHome.gp >= 3 && hHome.pct >= 0.70) {
    homeScore += 2;
    homeReasons.push(`${e.h.short} protects home turf (${e.h.split} at home)`);
  }
  if (aRoad && aRoad.gp >= 3 && aRoad.pct <= 0.30) {
    homeScore += 2;
    homeReasons.push(`${e.a.short} has struggled away from home (${e.a.split} on the road)`);
  } else if (aRoad && aRoad.gp >= 3 && aRoad.pct >= 0.70) {
    awayScore += 2;
    awayReasons.push(`${e.a.short} travels well (${e.a.split} road record)`);
  }
  if (hHome && hHome.gp >= 3 && hHome.pct <= 0.33) {
    awayScore += 1.5;
    awayReasons.push(`${e.h.short} hasn't defended home court/field (${e.h.split} at home)`);
  }

  // 3. Scoring Offense vs Defense Matchup
  if (aSt.ppg && hSt.ppg && aSt.papg && hSt.papg && g.s === 'NFL') {
    const aNet = aSt.ppg - aSt.papg;
    const hNet = hSt.ppg - hSt.papg;
    const netDiff = hNet - aNet;
    const avgCombined = (aSt.ppg + hSt.papg + hSt.ppg + aSt.papg) / 2;

    if (netDiff >= 4.5) {
      homeScore += 2.5;
      homeReasons.push(`${e.h.short} outscores opponents by +${hNet.toFixed(1)} PPG vs. ${e.a.short}'s ${aNet >= 0 ? '+' : ''}${aNet.toFixed(1)} PPG margin`);
    } else if (netDiff <= -4.5) {
      awayScore += 2.5;
      awayReasons.push(`${e.a.short} carries a +${aNet.toFixed(1)} PPG scoring margin vs. ${e.h.short}'s ${hNet >= 0 ? '+' : ''}${hNet.toFixed(1)} PPG`);
    }

    if (total && avgCombined - total >= 4.0) {
      overScore += 2.5;
      totalReasons.push(`Both teams' scoring averages project ~${avgCombined.toFixed(1)} combined points against a ${total} total`);
    } else if (total && total - avgCombined >= 4.0) {
      underScore += 2.5;
      totalReasons.push(`Combined scoring trends (~${avgCombined.toFixed(1)} PPG) sit well below the ${total} total`);
    }
  }

  // 4. College Ranked Road Trap Spot
  if ((g.s === 'NCAAF' || g.s === 'NCAAB') && g.rk) {
    const [rkA, rkH] = g.rk;
    if (rkA && !rkH && homeSpread != null && homeSpread > 0 && homeSpread <= 6.5) {
      homeScore += 2.5;
      homeReasons.push(`Ranked road trap: #${rkA} ${e.a.short} is laying under a touchdown on the road against unranked ${e.h.short}`);
    }
  }

  // 5. Weather Impact
  const isBadWeather = !e.indoor && ((e.temp && e.temp <= 34) || /wind|rain|snow|storm/i.test(e.weather));
  if (isBadWeather && total != null) {
    underScore += 2.5;
    totalReasons.push(`Tough outdoor conditions (${[e.weather, e.temp ? e.temp + '°F' : ''].filter(Boolean).join(', ')}) favor defense and clock-chewing possessions`);
  }

  const sideDiff = Math.abs(homeScore - awayScore);
  const topSideScore = Math.max(homeScore, awayScore);
  const topTotalScore = Math.max(overScore, underScore);

  if (topTotalScore >= 2.5 && topTotalScore > topSideScore && total != null) {
    const isOver = overScore > underScore;
    const b = bestLine(g.books, 't', isOver ? 'o' : 'u');
    if (b) {
      return {
        tier: topTotalScore >= 4 ? 'strong' : 'lean',
        score: topTotalScore,
        tierLabel: topTotalScore >= 4 ? '🔥 STRONG PLAY' : '👍 SOLID LEAN',
        pickTitle: `TAKE ${isOver ? 'OVER' : 'UNDER'} ${b.point} (${fm(b.odds)} at ${b.book})`,
        reason: totalReasons.join('. ') + '.',
        bet: { market: 't', side: isOver ? 'o' : 'u', label: `${g.a} @ ${g.h} ${isOver ? 'Over' : 'Under'} ${b.point}`, ...b }
      };
    }
  }

  if (topSideScore >= 2.0 && sideDiff >= 1.5) {
    const pickHome = homeScore > awayScore;
    const team = pickHome ? e.h : e.a;
    const fullTeam = pickHome ? g.h : g.a;
    const reasons = pickHome ? homeReasons : awayReasons;
    const sideCode = pickHome ? 'h' : 'a';

    const spLine = bestLine(g.books, 'sp', sideCode);
    const mlLine = bestLine(g.books, 'ml', sideCode);

    let chosen = spLine;
    let pickText = spLine ? `${team.short} ${ln(spLine.point)} (${fm(spLine.odds)} at ${spLine.book})` : '';

    if (mlLine && mlLine.odds >= 100 && mlLine.odds <= 220) {
      chosen = mlLine;
      pickText = `${team.short} Moneyline (${fm(mlLine.odds)} at ${mlLine.book})`;
    } else if (spLine && Math.abs(spLine.point) >= 13.5 && mlLine && mlLine.odds >= -320) {
      chosen = mlLine;
      pickText = `${team.short} Moneyline (${fm(mlLine.odds)} at ${mlLine.book})`;
    }

    if (chosen) {
      const extraContext = e.a.leaders?.[0] && e.h.leaders?.[0]
        ? ` Players to watch: ${e.a.short}'s ${e.a.leaders[0]} vs. ${e.h.short}'s ${e.h.leaders[0]}.`
        : '';
      return {
        tier: topSideScore >= 4.0 ? 'strong' : 'lean',
        score: topSideScore,
        tierLabel: topSideScore >= 4.0 ? '🔥 STRONG PLAY' : '👍 SOLID LEAN',
        pickTitle: `PICK: ${pickText}`,
        reason: reasons.slice(0, 3).join('. ') + '.' + extraContext,
        bet: { market: chosen.point != null ? 'sp' : 'ml', side: sideCode, label: `${fullTeam} ${chosen.point != null ? ln(chosen.point) : 'ML'}`, ...chosen }
      };
    }
  }

  const leanHome = (homeSpread ?? 0) < 0;
  const fallbackSide = leanHome ? 'h' : 'a';
  const fallbackBet = bestLine(g.books, 'sp', fallbackSide) || bestLine(g.books, 'ml', fallbackSide);
  return {
    tier: 'pass',
    score: 0,
    tierLabel: '⚖️ TOSS-UP / PASS',
    pickTitle: 'No Clear Matchup Edge — Evenly Matched',
    reason: `${e.a.short} (${e.a.rec || 'N/A'}) and ${e.h.short} (${e.h.rec || 'N/A'}) grade out evenly on paper${homeSpread != null ? ` with a tight ${ln(homeSpread)} line` : ''}. Better as a watch-only game.`,
    bet: fallbackBet ? { market: fallbackBet.point != null ? 'sp' : 'ml', side: fallbackSide, label: `${leanHome ? g.h : g.a} ${fallbackBet.point != null ? ln(fallbackBet.point) : 'ML'}`, ...fallbackBet } : null
  };
}

/* ---------- LOAD PIPELINE ---------- */
async function load(force) {
  if (force) Object.keys(localStorage).filter(k => k.startsWith('gp_c_')).forEach(k => localStorage.removeItem(k));
  st.err = [];
  let gs = [];
  $('#main').innerHTML = `<div class="card p-10 text-center text-slate-400">Analyzing live matchups, team records, and sportsbook lines…</div>`;

  if (!st.cfg.key) {
    st.games = getSampleGames();
    render();
    return;
  }

  for (const sp in SP) {
    if (!st.cfg.on[sp]) continue;
    try {
      const [oddsGames, espnGames, standingsMap] = await Promise.all([
        cached('odds_' + sp, () => oddsFetch(sp)),
        espnFetch(sp).catch(() => []),
        standingsFetch(sp).catch(() => ({}))
      ]);

      oddsGames.forEach(g => {
        let best = null, bs = 0;
        espnGames.forEach(e => {
          const s = (sim(g.a, e.a) + sim(g.h, e.h)) / 2;
          if (s > bs) { bs = s; best = e; }
        });
        if (best && bs >= 0.5) {
          g.e = best;
          g.e.a.standings = standingsMap[best.a.id] || {};
          g.e.h.standings = standingsMap[best.h.id] || {};
          g.rk = [best.a.rk, best.h.rk];
          const m = CF[sp];
          if (m) g.cf = m[best.h.cf] || m[best.a.cf] || '';
        }
        g.rec = generateRecommendation(g);
      });

      gs.push(...oddsGames);
    } catch (e) {
      st.err.push(e.message);
    }
  }

  gs.sort((a, b) => new Date(a.ts) - new Date(b.ts));
  st.games = gs;
  render();
}

/* ---------- RENDER ---------- */
function setView(v) { st.view = v; render(); }

function render() {
  const hasKey = !!st.cfg.key;
  $('#mode').textContent = hasKey ? 'LIVE DATA' : 'SAMPLE PREVIEW';
  $('#mode').className = `tag ${hasKey ? 't-green' : 't-yellow'}`;
  $('#rem').textContent = hasKey ? `Credits: ${st.rem ?? '—'}` : 'Paste API Key for Live';

  $('#tabs').innerHTML = ['All', ...Object.keys(SP)].map(t =>
    `<button class="btn ${st.tab === t ? 'on' : ''}" onclick="st.tab='${t}';render()">${t === 'All' ? 'All Sports' : SP[t].label}</button>`
  ).join('');

  $('#vb').classList.toggle('on', st.view === 'board');
  $('#vt').classList.toggle('on', st.view === 'bets');

  const isCol = st.tab === 'NCAAF' || st.tab === 'NCAAB';
  if (st.view === 'board') {
    $('#sub').innerHTML = `
      <label class="btn ${st.onlyStrong ? 'on' : ''}">
        <input type="checkbox" class="hidden" ${st.onlyStrong ? 'checked' : ''} onchange="st.onlyStrong=this.checked;render()">
        🔥 Recommended Plays Only (Hide Toss-Ups)
      </label>
      ${isCol ? `
        <label class="btn ${st.rank ? 'on' : ''}">
          <input type="checkbox" class="hidden" ${st.rank ? 'checked' : ''} onchange="st.rank=this.checked;render()">Top 25 Ranked Only
        </label>
        <label class="btn ${st.power ? 'on' : ''}">
          <input type="checkbox" class="hidden" ${st.power ? 'checked' : ''} onchange="st.power=this.checked;render()">Power Conferences
        </label>
      ` : ''}
    `;
  } else {
    $('#sub').innerHTML = '';
  }

  st.view === 'board' ? rBoard() : rBets();
}

function rBoard() {
  let gs = st.games.filter(g => st.tab === 'All' || g.s === st.tab);
  if (st.onlyStrong) gs = gs.filter(g => g.rec && g.rec.tier !== 'pass');
  if (st.tab === 'NCAAF' || st.tab === 'NCAAB') {
    if (st.rank) gs = gs.filter(g => g.rk && (g.rk[0] || g.rk[1]));
    if (st.power) gs = gs.filter(g => POW.includes(g.cf));
  }

  // Top 3 Picks Summary Banner
  const topPicks = [...gs]
    .filter(g => g.rec && g.rec.tier !== 'pass')
    .sort((a, b) => b.rec.score - a.rec.score)
    .slice(0, 3);

  const banner = !st.cfg.key ? `
    <div class="card p-3.5 mb-4 border-yellow-700/60 bg-yellow-950/20 flex flex-wrap items-center justify-between gap-2">
      <div class="text-sm text-yellow-200">
        <b>Viewing Sample Matchups:</b> Click <b>⚙ API Key</b> in the top right to paste your Odds API key and load today's live games.
      </div>
      <button class="btn on !py-1.5 text-xs" onclick="openCfg()">Paste API Key</button>
    </div>` : '';

  const topSummary = topPicks.length ? `
    <div class="card p-4 mb-4 border-green-800/60 bg-[#0e1924]">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="font-bold text-sm uppercase tracking-wider text-green-400">🎯 Best Plays on This Board</h2>
        <span class="text-xs text-slate-400">Highest matchup edges</span>
      </div>
      <div class="grid sm:grid-cols-3 gap-2.5">
        ${topPicks.map(g => `
          <div class="p-3 rounded-lg bg-[#0b0f17] border border-slate-800 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-1 mb-1">
                <span class="tag ${g.rec.tier === 'strong' ? 't-green' : 't-blue'}">${g.rec.tierLabel}</span>
                <span class="text-[11px] text-slate-400">${g.s}</span>
              </div>
              <div class="font-bold text-sm text-white mb-1">${g.rec.pickTitle.replace(/^PICK:\s*|^TAKE\s*/i, '')}</div>
              <div class="text-xs text-slate-400 line-clamp-2">${g.rec.reason}</div>
            </div>
            <button class="btn on !py-1 !px-2 text-xs mt-2.5 w-full !bg-green-700 hover:!bg-green-600" onclick="openSlip('${g.id}')">+ Log Play</button>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  $('#main').innerHTML =
    banner +
    (st.err.length ? `<div class="card p-3 mb-3 border-red-800 bg-red-950/30 text-red-300 text-sm">${st.err.join('<br>')}</div>` : '') +
    topSummary +
    (gs.length ? gs.map(renderCard).join('') : '<div class="card p-8 text-center text-slate-400">No upcoming games match these filters.</div>');
}

function renderCard(g) {
  const e = g.e || {};
  const rk = g.rk || [];
  const rec = g.rec;
  const isLiveOrFinal = e.state && e.state !== 'pre';
  const showOdds = !!st.openOdds[g.id];

  const boxClass = rec.tier === 'strong' ? 'pick-box' : rec.tier === 'lean' ? 'lean-box' : 'pass-box';
  const badgeClass = rec.tier === 'strong' ? 't-green' : rec.tier === 'lean' ? 't-blue' : 't-slate';

  const teamBlock = (name, rank, info, isHome) => {
    const stData = info?.standings || {};
    return `
      <div class="p-3 rounded-lg bg-[#0b0f17] border border-slate-800/80">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-2 min-w-0">
            ${info?.logo ? `<img src="${info.logo}" class="w-7 h-7 object-contain shrink-0" alt="">` : ''}
            ${rank ? `<span class="tag t-yellow shrink-0">#${rank}</span>` : ''}
            <span class="font-bold text-base truncate">${name}</span>
          </div>
          ${isLiveOrFinal && info?.sc != null ? `<span class="font-extrabold text-lg text-white ml-2">${info.sc}</span>` : `<span class="text-[11px] uppercase tracking-wider text-slate-500">${isHome ? 'HOME' : 'AWAY'}</span>`}
        </div>
        <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400">
          <span>Record: <b class="text-slate-200">${info?.rec || '—'}</b></span>
          ${info?.split ? `<span>${isHome ? 'Home' : 'Road'}: <b class="text-slate-200">${info.split}</b></span>` : ''}
          ${stData.ppg ? `<span>Scores: <b class="text-slate-200">${Number(stData.ppg).toFixed(1)}/g</b></span>` : ''}
          ${stData.papg ? `<span>Allows: <b class="text-slate-200">${Number(stData.papg).toFixed(1)}/g</b></span>` : ''}
        </div>
      </div>`;
  };

  const rows = BK.filter(b => g.books[b]).map(b => {
    const v = g.books[b];
    return `
      <tr class="border-t border-slate-800 text-xs">
        <td class="p-1.5 font-semibold text-slate-400">${b}</td>
        <td class="p-1.5 text-center">${v.ml ? `${fm(v.ml[0])} / ${fm(v.ml[1])}` : '–'}</td>
        <td class="p-1.5 text-center">${v.sp ? `${g.h.split(' ').pop()} ${ln(v.sp[0])} (${fm(v.sp[2])})` : '–'}</td>
        <td class="p-1.5 text-center">${v.t ? `O/U ${v.t[0]} (${fm(v.t[1])})` : '–'}</td>
      </tr>`;
  }).join('');

  return `
    <div class="card p-4 mb-4">
      <div class="flex flex-wrap items-center gap-2 text-xs mb-3">
        <span class="tag t-blue">${g.s}</span>
        ${g.cf ? `<span class="tag t-slate">${g.cf}</span>` : ''}
        <span class="text-slate-300 font-medium">${e.st || g.tm}</span>
        ${e.venue ? `<span class="text-slate-500">· ${e.venue}</span>` : ''}
        ${!e.indoor && (e.weather || e.temp) ? `<span class="tag t-yellow ml-auto">🌤️ ${[e.weather, e.temp ? e.temp + '°F' : ''].filter(Boolean).join(', ')}</span>` : ''}
      </div>

      <div class="grid sm:grid-cols-2 gap-2.5 mb-3">
        ${teamBlock(g.a, rk[0], e.a, false)}
        ${teamBlock(g.h, rk[1], e.h, true)}
      </div>

      <!-- SUGGESTION & CONFIDENCE CALLOUT -->
      <div class="${boxClass} p-3.5">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
          <div class="flex items-center gap-2">
            <span class="tag ${badgeClass}">${rec.tierLabel}</span>
            <span class="font-bold text-base text-white">${rec.pickTitle}</span>
          </div>
          ${rec.bet ? `
            <button class="btn on !py-1 !px-3 text-xs !bg-green-600 hover:!bg-green-500" onclick="openSlip('${g.id}')">
              + Log This Pick
            </button>
          ` : ''}
        </div>
        <p class="text-sm text-slate-200 leading-relaxed">${rec.reason}</p>
      </div>

      <div class="mt-2.5 flex items-center justify-between">
        <button class="text-xs text-slate-400 hover:text-slate-200" onclick="st.openOdds['${g.id}']=!st.openOdds['${g.id}'];render()">
          ${showOdds ? '▲ Hide sportsbook lines' : '▼ Compare DK / FD / MGM lines'}
        </button>
      </div>

      ${showOdds ? `
        <div class="mt-2 overflow-x-auto rounded-lg border border-slate-800">
          <table class="w-full">
            <tr class="bg-[#0b0f17] text-[11px] text-slate-400">
              <th class="text-left p-1.5">Book</th>
              <th class="p-1.5">Moneyline (Away / Home)</th>
              <th class="p-1.5">Home Spread</th>
              <th class="p-1.5">Game Total</th>
            </tr>
            ${rows}
          </table>
        </div>
      ` : ''}
    </div>`;
}

/* ---------- LOG PICK DRAWER ---------- */
function openSlip(id) {
  const g = st.games.find(x => x.id === id);
  const rec = g.rec;
  if (!rec?.bet) return;

  st.slip = { sport: g.s, desc: `${rec.bet.label} [${rec.bet.book}]`, o: rec.bet.odds, reason: rec.reason };
  const el = $('#slip');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="flex justify-between items-center mb-2">
      <b class="text-base">Log Play</b>
      <button class="text-slate-400 hover:text-white" onclick="$('#slip').classList.add('hidden')">✕</button>
    </div>
    <div class="p-2.5 rounded-lg bg-[#0b0f17] border border-slate-800 mb-3">
      <div class="font-bold text-sm text-green-400">${rec.bet.label}</div>
      <div class="text-xs text-slate-400 mt-0.5">${g.s} · ${fm(rec.bet.odds)} at ${rec.bet.book}</div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="text-xs text-slate-400">Odds</label>
        <input id="so" type="number" value="${rec.bet.odds}">
      </div>
      <div>
        <label class="text-xs text-slate-400">Bet Size (Units)</label>
        <select id="su">
          <option value="0.5">0.5u (Lean)</option>
          <option value="1" selected>1.0u (Standard)</option>
          <option value="2">2.0u (Strong)</option>
          <option value="3">3.0u (Max Play)</option>
        </select>
      </div>
    </div>

    <label class="text-xs text-slate-400 block mb-1">Matchup Reason</label>
    <textarea id="snote" rows="3">${rec.reason}</textarea>

    <button class="btn on w-full mt-3 !bg-green-600 hover:!bg-green-500 text-center" onclick="logBet()">Save to My Record</button>
    <p id="smsg" class="text-xs text-green-400 mt-2 text-center"></p>
  `;
}

function logBet() {
  const o = +$('#so').value;
  const u = +$('#su').value;
  const note = $('#snote').value.trim();
  if (!o || !u) return;

  st.bets.push({
    id: Date.now(),
    d: new Date().toISOString().slice(0, 10),
    s: st.slip.sport,
    desc: st.slip.desc,
    odds: o,
    units: u,
    note,
    st: 'pending'
  });
  W('gp_bets', st.bets);
  $('#smsg').textContent = 'Saved ✓';
  setTimeout(() => $('#slip').classList.add('hidden'), 800);
}

/* ---------- MY RECORD ---------- */
const unitPL = b => b.st === 'win' ? b.units * (dec(b.odds) - 1) : b.st === 'loss' ? -b.units : 0;

function setB(id, f, v) {
  const b = st.bets.find(x => x.id === id);
  b[f] = v;
  W('gp_bets', st.bets);
  rBets();
}

function delB(id) {
  st.bets = st.bets.filter(b => b.id !== id);
  W('gp_bets', st.bets);
  rBets();
}

function rBets() {
  const sett = st.bets.filter(b => b.st !== 'pending');
  const netU = sett.reduce((a, b) => a + unitPL(b), 0);
  const w = sett.filter(b => b.st === 'win').length;
  const l = sett.filter(b => b.st === 'loss').length;
  const uVal = st.cfg.unit || 25;

  const KPI = (lbl, val, cls = '') => `
    <div class="card p-3">
      <div class="text-xs text-slate-400">${lbl}</div>
      <div class="text-xl font-bold mt-0.5 ${cls}">${val}</div>
    </div>`;

  $('#main').innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
      ${KPI('Net Units', `${netU >= 0 ? '+' : ''}${netU.toFixed(2)}u`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Net Profit ($)', `${netU >= 0 ? '+' : '-'}$${Math.abs(netU * uVal).toFixed(0)}`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Win Rate', w + l ? `${(w / (w + l) * 100).toFixed(1)}%` : '–')}
      ${KPI('Record', `${w}-${l}`)}
    </div>

    <div class="card p-3 mb-3"><canvas id="ch" height="75"></canvas></div>

    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <tr class="text-xs text-slate-400 text-left border-b border-slate-800">
          <th class="p-2.5">Date</th>
          <th>Sport</th>
          <th>Pick & Matchup Reason</th>
          <th>Odds</th>
          <th>Size</th>
          <th>Result</th>
          <th>P/L</th>
          <th></th>
        </tr>
        ${st.bets.slice().reverse().map(b => {
          const p = unitPL(b);
          return `
            <tr class="border-t border-slate-800/70">
              <td class="p-2.5 text-slate-400 text-xs whitespace-nowrap">${b.d}</td>
              <td><span class="tag t-blue">${b.s}</span></td>
              <td class="py-2 pr-2">
                <div class="font-semibold">${b.desc}</div>
                ${b.note ? `<div class="text-xs text-slate-400 mt-0.5">${b.note}</div>` : ''}
              </td>
              <td>${fm(b.odds)}</td>
              <td>${b.units}u</td>
              <td>
                <select class="!w-24 !py-1" onchange="setB(${b.id},'st',this.value)">
                  ${['pending', 'win', 'loss', 'push'].map(s => `<option ${b.st === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </td>
              <td class="font-semibold ${p > 0 ? 'text-green-400' : p < 0 ? 'text-red-400' : ''}">${p ? `${p > 0 ? '+' : ''}${p.toFixed(2)}u` : '–'}</td>
              <td><button class="text-slate-500 hover:text-red-400 px-2" onclick="delB(${b.id})">✕</button></td>
            </tr>`;
        }).join('') || '<tr><td colspan="8" class="p-6 text-center text-slate-400">No picks logged yet.</td></tr>'}
      </table>
    </div>`;

  const sp = Object.keys(SP);
  const data = sp.map(s => st.bets.filter(b => b.s === s && b.st !== 'pending').reduce((a, b) => a + unitPL(b), 0));
  if (chart) chart.destroy();
  chart = new Chart($('#ch'), {
    type: 'bar',
    data: {
      labels: sp,
      datasets: [{
        label: 'Units Won / Lost by Sport',
        data,
        backgroundColor: data.map(v => v >= 0 ? '#22c55e' : '#ef4444'),
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e5e7eb' } } },
      scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
      }
    }
  });
}

/* ---------- SETTINGS ---------- */
function openCfg() {
  const c = st.cfg;
  const m = $('#modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  m.innerHTML = `
    <div class="card p-5 w-full max-w-md border-slate-700">
      <h2 class="font-bold text-lg mb-3">API & Sports Setup</h2>

      <label class="text-xs text-slate-400">The Odds API Key</label>
      <input id="k" type="password" value="${c.key}" placeholder="Paste key from the-odds-api.com">

      <p class="text-xs text-slate-400 mt-4 mb-1.5">Sports to Analyze</p>
      <div class="flex flex-wrap gap-3 text-sm mb-4">
        ${Object.keys(SP).map(s => `
          <label class="flex gap-1.5 items-center cursor-pointer">
            <input type="checkbox" class="!w-auto" id="on_${s}" ${c.on[s] ? 'checked' : ''}>${s}
          </label>
        `).join('')}
      </div>

      <div class="mb-4">
        <label class="text-xs text-slate-400">1 Unit Value ($)</label>
        <input id="un" type="number" value="${c.unit}">
      </div>

      <div class="flex gap-2 justify-end">
        <button class="btn" onclick="closeCfg()">Cancel</button>
        <button class="btn on" onclick="saveCfg()">Save & Load Picks</button>
      </div>
    </div>`;
}

function closeCfg() {
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}

function saveCfg() {
  const on = {};
  Object.keys(SP).forEach(s => on[s] = $('#on_' + s).checked ? 1 : 0);
  st.cfg = {
    key: $('#k').value.trim(),
    on,
    unit: +$('#un').value || 25
  };
  W('gp_cfg', st.cfg);
  closeCfg();
  load(true);
}

load();
</script>
