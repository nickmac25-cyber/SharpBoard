<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchup Board — Sports-First Betting Insights</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { background: #0b0f17; color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif; }
  .card { background: #121826; border: 1px solid #1f2937; border-radius: 12px; }
  .odd-btn { padding: .35rem .5rem; border-radius: 8px; background: #1b2436; font-size: 12px; white-space: nowrap; transition: all .15s; border: 1px solid transparent; }
  .odd-btn:hover { background: #26334d; border-color: #3b82f6; }
  .best-odd { color: #4ade80; font-weight: 700; background: #112a1d; border-color: #166534; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
  .t-green { background: #12301f; color: #4ade80; border: 1px solid #166534; }
  .t-yellow { background: #33270d; color: #facc15; border: 1px solid #854d0e; }
  .t-red { background: #381519; color: #f87171; border: 1px solid #991b1b; }
  .t-blue { background: #13284a; color: #60a5fa; border: 1px solid #1e40af; }
  .t-slate { background: #1e293b; color: #cbd5e1; }
  input, select, textarea { background: #0b0f17; border: 1px solid #2a3550; border-radius: 8px; padding: .4rem .6rem; color: #e5e7eb; width: 100%; font-size: 13px; }
  .tab { padding: .4rem .85rem; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .tab.on { background: #2563eb; color: #fff; }
  .tab:not(.on) { background: #1b2436; color: #cbd5e1; }
  .tab:not(.on):hover { background: #26334d; }
</style>
</head>
<body>

<header class="sticky top-0 z-20 bg-[#0b0f17]/95 backdrop-blur border-b border-slate-800 p-3">
  <div class="max-w-6xl mx-auto flex flex-wrap items-center gap-2">
    <div class="flex items-center gap-2 mr-2">
      <span class="text-xl">🏟️</span>
      <h1 class="font-bold text-lg tracking-tight">Matchup Board</h1>
    </div>
    <div id="tabs" class="flex flex-wrap gap-1"></div>
    <div class="ml-auto flex items-center gap-2 text-sm">
      <span id="mode" class="tag t-blue"></span>
      <span id="rem" class="tag t-yellow" title="Remaining Odds API Credits"></span>
      <button class="tab" onclick="setView('board')" id="vb">Matchups</button>
      <button class="tab" onclick="setView('bets')" id="vt">My Picks</button>
      <button class="tab" onclick="load(true)" title="Force fresh API fetch">⟳ Sync</button>
      <button class="tab" onclick="openCfg()">⚙ API & Setup</button>
    </div>
  </div>
  <div id="sub" class="max-w-6xl mx-auto flex flex-wrap gap-2 mt-2 items-center"></div>
</header>

<main id="main" class="p-3 max-w-6xl mx-auto pb-24"></main>

<!-- Pick Slip Drawer -->
<aside id="slip" class="fixed right-3 bottom-3 sm:top-16 sm:bottom-auto w-[calc(100%-1.5rem)] sm:w-80 card p-4 z-30 hidden shadow-2xl border-slate-700"></aside>

<!-- Settings Modal -->
<div id="modal" class="fixed inset-0 z-40 hidden bg-black/75 items-center justify-center p-3"></div>

<script>
const $ = s => document.querySelector(s);
const S = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const W = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const SP = {
  NFL:   { k: 'americanfootball_nfl', e: 'football/nfl' },
  NCAAF: { k: 'americanfootball_ncaaf', e: 'football/college-football', g: 80 },
  NCAAB: { k: 'basketball_ncaab', e: 'basketball/mens-college-basketball', g: 50 },
  NHL:   { k: 'icehockey_nhl', e: 'hockey/nhl' },
  MLB:   { k: 'baseball_mlb', e: 'baseball/mlb' }
};

const BK = ['DK', 'FD', 'MGM'];
const BN = { draftkings: 'DK', fanduel: 'FD', betmgm: 'MGM' };
const POW = ['SEC', 'Big Ten', 'Big 12', 'ACC', 'Big East'];
const CF = {
  NCAAF: { 1:'ACC', 4:'Big 12', 5:'Big Ten', 8:'SEC', 9:'Pac-12', 12:'C-USA', 15:'MAC', 17:'MWC', 37:'Sun Belt', 151:'AAC', 18:'Ind' },
  NCAAB: { 2:'ACC', 3:'A-10', 4:'Big East', 7:'Big Ten', 8:'Big 12', 23:'SEC', 9:'Pac-12', 46:'WCC' }
};

let st = {
  tab: 'All',
  rank: false,
  power: false,
  conf: '',
  onlyEdges: false,
  open: {},
  slip: null,
  view: 'board',
  games: [],
  err: [],
  cfg: S('mb_cfg', { key: '', live: false, on: { NFL: 1, NCAAF: 1, NCAAB: 1, NHL: 1, MLB: 0 }, unit: 25 }),
  bets: S('mb_bets', []),
  rem: S('mb_rem', null)
};
let chart;

const dec = o => o > 0 ? 1 + o / 100 : 1 + 100 / -o;
const fm = o => o == null ? '–' : o > 0 ? '+' + o : '' + o;
const ln = n => n > 0 ? '+' + n : '' + n;

/* ---------- CACHE HELPER (15 MIN TTL) ---------- */
async function cached(k, fn, ttl = 9e5) {
  const c = S('mb_c_' + k, null);
  if (c && Date.now() - c.t < ttl) return c.d;
  const d = await fn();
  W('mb_c_' + k, { t: Date.now(), d });
  return d;
}

/* ---------- LIVE DATA FETCHERS ---------- */
async function oddsFetch(sp) {
  const u = `https://api.the-odds-api.com/v4/sports/${SP[sp].k}/odds/?apiKey=${encodeURIComponent(st.cfg.key)}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm`;
  const res = await fetch(u);
  if (!res.ok) {
    if (res.status === 401) throw new Error('Invalid Odds API Key. Check Settings.');
    if (res.status === 429) throw new Error('Odds API Rate Limit / Out of Credits.');
    throw new Error(`${sp}: Odds API Error ${res.status}`);
  }
  const rm = res.headers.get('x-requests-remaining');
  if (rm != null) { st.rem = rm; W('mb_rem', rm); }
  const j = await res.json();
  return j.map(e => {
    const g = {
      id: e.id,
      s: sp,
      a: e.away_team,
      h: e.home_team,
      ts: e.commence_time,
      tm: new Date(e.commence_time).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
      books: {},
      angles: []
    };
    e.bookmakers.forEach(b => {
      const n = BN[b.key];
      if (!n) return;
      const o = {};
      b.markets.forEach(m => {
        const A = m.outcomes.find(x => x.name === e.away_team);
        const H = m.outcomes.find(x => x.name === e.home_team);
        if (m.key === 'h2h' && A && H) o.ml = [A.price, H.price];
        if (m.key === 'spreads' && A && H) o.sp = [H.point, A.price, H.price];
        if (m.key === 'totals') {
          const ov = m.outcomes.find(x => x.name === 'Over');
          const un = m.outcomes.find(x => x.name === 'Under');
          if (ov && un) o.t = [ov.point, ov.price, un.price];
        }
      });
      g.books[n] = o;
    });
    return g;
  });
}

async function espnFetch(sp) {
  const c = SP[sp];
  return cached('espn_' + sp, async () => {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${c.e}/scoreboard?limit=300` + (c.g ? `&groups=${c.g}` : ''));
    const j = await res.json();
    return (j.events || []).map(ev => {
      const comp = ev.competitions[0];
      const cp = comp.competitors;
      const parseTeam = side => {
        const q = cp.find(x => x.homeAway === side);
        const t = q.team;
        const recs = q.records || [];
        const overall = (recs.find(r => r.type === 'total') || recs[0] || {}).summary || '';
        const split = (recs.find(r => r.type === (side === 'home' ? 'home' : 'road')) || {}).summary || '';
        const stats = {};
        (q.statistics || []).forEach(st => { stats[st.name] = st.displayValue; });
        const leaders = (q.leaders || []).slice(0, 2).map(l => `${l.shortDisplayName}: ${l.leaders?.[0]?.athlete?.shortName} (${l.leaders?.[0]?.displayValue})`);
        return {
          id: t.id,
          n: t.displayName,
          short: t.shortDisplayName || t.name,
          loc: t.location || '',
          logo: t.logo,
          sc: q.score,
          cf: t.conferenceId,
          rk: q.curatedRank && q.curatedRank.current > 0 && q.curatedRank.current <= 25 ? q.curatedRank.current : null,
          rec: overall,
          split,
          stats,
          leaders
        };
      };
      return {
        espnId: ev.id,
        h: parseTeam('home'),
        a: parseTeam('away'),
        st: ev.status.type.shortDetail,
        state: ev.status.type.state,
        venue: comp.venue?.fullName || '',
        indoor: comp.venue?.indoor ?? false,
        weather: ev.weather?.displayValue || '',
        temp: ev.weather?.temperature || null,
        headline: comp.notes?.[0]?.headline || ''
      };
    });
  }, 6e5);
}

/* Fuzzy team matcher */
const AL = {
  uconn: 'connecticut', 'ole miss': 'mississippi', usc: 'southern california', pitt: 'pittsburgh',
  umass: 'massachusetts', ucf: 'central florida', smu: 'southern methodist', tcu: 'texas christian',
  byu: 'brigham young', unlv: 'nevada las vegas', lsu: 'louisiana state', vcu: 'virginia commonwealth',
  'miami fl': 'miami', 'miami (fl)': 'miami', saint: 'st', 'st.': 'st'
};
const nz = s => {
  s = (s || '').toLowerCase().replace(/[’']/g, '').replace(/[.&]/g, m => m === '.' ? '' : ' ').replace(/[()-]/g, ' ');
  for (const k in AL) s = s.replace(new RegExp('\\b' + k.replace(/[.()]/g, '') + '\\b', 'g'), AL[k]);
  return s.replace(/\bstate\b/g, 'st').replace(/\bsaint\b/g, 'st').replace(/\s+/g, ' ').trim();
};
const sim = (a, t) => {
  const A = nz(a).split(' '), B = nz(t.n).split(' ');
  const i = A.filter(x => B.includes(x)).length;
  const s1 = i / Math.max(A.length, B.length);
  const L = nz(t.loc);
  return Math.max(s1, L && nz(a).startsWith(L) ? .9 : 0);
};

function mergeAndAnalyze(gs, ev, sp) {
  gs.forEach(g => {
    let best = null, bs = 0;
    ev.forEach(e => {
      const s = (sim(g.a, e.a) + sim(g.h, e.h)) / 2;
      if (s > bs) { bs = s; best = e; }
    });
    if (best && bs >= 0.5) {
      g.e = best;
      g.rk = [best.a.rk, best.h.rk];
      const m = CF[sp];
      if (m) g.cf = m[best.h.cf] || m[best.a.cf] || '';
    }
    g.angles = buildMatchupAngles(g);
  });
}

/* ---------- SPORTS-WATCHING MATCHUP ENGINE ---------- */
function parseRec(r) {
  if (!r) return null;
  const p = r.split('-').map(Number);
  if (p.length < 2 || isNaN(p[0]) || isNaN(p[1])) return null;
  const tot = p[0] + p[1] + (p[2] || 0);
  return { w: p[0], l: p[1], pct: tot ? p[0] / tot : 0, gp: tot };
}

function buildMatchupAngles(g) {
  const angles = [];
  const e = g.e;
  const firstBook = Object.values(g.books)[0] || {};
  const homeSpread = firstBook.sp ? firstBook.sp[0] : null;
  const total = firstBook.t ? firstBook.t[0] : null;

  if (!e) {
    angles.push({ text: 'Schedule/ESPN matchup data pending sync', type: 't-slate', score: 0 });
    return angles;
  }

  const aRec = parseRec(e.a.rec);
  const hRec = parseRec(e.h.rec);
  const aRoad = parseRec(e.a.split);
  const hHome = parseRec(e.h.split);

  // 1. Record & Form Disparity vs. Line
  if (aRec && hRec && aRec.gp >= 3 && hRec.gp >= 3) {
    const diff = hRec.pct - aRec.pct;
    if (diff >= 0.30 && homeSpread != null && homeSpread > -6.5) {
      angles.push({
        text: `🔥 Record Edge: ${e.h.short} (${e.h.rec}) hosts struggling ${e.a.short} (${e.a.rec}) at a manageable ${ln(homeSpread)}`,
        type: 't-green',
        score: 3
      });
    } else if (diff <= -0.30 && homeSpread != null && homeSpread > -3.5) {
      angles.push({
        text: `🔥 Road Superiority: ${e.a.short} (${e.a.rec}) has a massive record edge over ${e.h.short} (${e.h.rec})`,
        type: 't-green',
        score: 3
      });
    }
  }

  // 2. Home Fortress vs. Road Woes
  if (hHome && hHome.gp >= 3 && hHome.pct >= 0.75) {
    angles.push({
      text: `🏠 Home Fortress: ${e.h.short} is ${e.h.split} at home this season`,
      type: 't-green',
      score: 2
    });
  }
  if (aRoad && aRoad.gp >= 3 && aRoad.pct <= 0.25) {
    angles.push({
      text: `✈️ Road Struggles: ${e.a.short} is just ${e.a.split} away from home`,
      type: 't-yellow',
      score: 2
    });
  } else if (aRoad && aRoad.gp >= 3 && aRoad.pct >= 0.75) {
    angles.push({
      text: `🚌 Road Warriors: ${e.a.short} thrives away (${e.a.split})`,
      type: 't-blue',
      score: 2
    });
  }

  // 3. College Ranked Trap / Unranked Home Dog Spot
  if ((g.s === 'NCAAF' || g.s === 'NCAAB') && g.rk) {
    const [rkA, rkH] = g.rk;
    if (rkA && !rkH && homeSpread != null && homeSpread <= 6.5) {
      angles.push({
        text: `🚨 Ranked Road Trap: #${rkA} ${e.a.short} is only favored by ${Math.abs(homeSpread)} at unranked ${e.h.short}`,
        type: 't-yellow',
        score: 3
      });
    }
    if (rkA && rkH) {
      angles.push({
        text: `🏆 Top-25 Clash: #${rkA} ${e.a.short} at #${rkH} ${e.h.short}`,
        type: 't-blue',
        score: 1
      });
    }
  }

  // 4. Weather & Venue Context (Football / Baseball)
  if (e.indoor) {
    angles.push({ text: `🏟️ Dome / Indoor: Clean conditions (${e.venue})`, type: 't-slate', score: 0 });
  } else if (e.weather || e.temp) {
    const wStr = [e.weather, e.temp ? `${e.temp}°F` : ''].filter(Boolean).join(', ');
    const isRough = (e.temp && e.temp <= 36) || /wind|rain|snow|storm/i.test(e.weather);
    angles.push({
      text: `${isRough ? '🌬️ Weather Factor:' : '🌤️ Forecast:'} ${wStr}${isRough ? ' — watch ground game / Under' : ''}`,
      type: isRough ? 't-yellow' : 't-slate',
      score: isRough ? 2 : 0
    });
  }

  // 5. Key Stat & Team Leaders Matchup
  if (e.a.leaders?.length || e.h.leaders?.length) {
    const aLead = e.a.leaders?.[0] ? `${e.a.short} (${e.a.leaders[0]})` : '';
    const hLead = e.h.leaders?.[0] ? `${e.h.short} (${e.h.leaders[0]})` : '';
    if (aLead || hLead) {
      angles.push({
        text: `⭐ Key Players: ${[aLead, hLead].filter(Boolean).join(' vs. ')}`,
        type: 't-blue',
        score: 1
      });
    }
  }

  // 6. Close Spread / Toss-Up Alert
  if (homeSpread != null && Math.abs(homeSpread) <= 2.5) {
    angles.push({
      text: `⚖️ Toss-Up Game: Tight ${ln(homeSpread)} spread — comes down to late execution`,
      type: 't-slate',
      score: 1
    });
  }

  // 7. High Total Shootout Alert
  if ((g.s === 'NFL' || g.s === 'NCAAF') && total >= 55) {
    angles.push({ text: `🎆 Shootout Expected: High ${total} game total`, type: 't-blue', score: 1 });
  } else if (g.s === 'NCAAB' && total >= 156) {
    angles.push({ text: `⚡ Track Meet: Up-tempo ${total} total`, type: 't-blue', score: 1 });
  } else if (g.s === 'NHL' && total >= 6.5) {
    angles.push({ text: `🚨 High-Event Hockey: ${total} goal total`, type: 't-blue', score: 1 });
  }

  if (!angles.length) {
    angles.push({ text: 'Standard matchup — check line shopping across books', type: 't-slate', score: 0 });
  }

  return angles.sort((a, b) => b.score - a.score);
}

/* ---------- LOAD PIPELINE ---------- */
async function load(force) {
  if (force) Object.keys(localStorage).filter(k => k.startsWith('mb_c_')).forEach(k => localStorage.removeItem(k));
  st.err = [];
  let gs = [];
  $('#main').innerHTML = `<div class="card p-10 text-center text-slate-400">Syncing live odds & ESPN matchup feeds…</div>`;

  if (!st.cfg.key) {
    st.games = [];
    render();
    return;
  }

  for (const sp in SP) {
    if (!st.cfg.on[sp]) continue;
    try {
      const oddsGames = await cached('odds_' + sp, () => oddsFetch(sp));
      try {
        const espnGames = await espnFetch(sp);
        mergeAndAnalyze(oddsGames, espnGames, sp);
      } catch (e) {
        st.err.push(`ESPN ${sp} stats unavailable (showing odds only)`);
      }
      gs.push(...oddsGames);
    } catch (e) {
      st.err.push(e.message);
    }
  }

  // Sort by soonest start time
  gs.sort((a, b) => new Date(a.ts) - new Date(b.ts));
  st.games = gs;
  render();
}

/* ---------- RENDERING ---------- */
function setView(v) { st.view = v; render(); }

function bestBook(B, fn) {
  let bb = null, bv = -1e9;
  for (const b in B) {
    const v = fn(B[b]);
    if (v != null && v > bv) { bv = v; bb = b; }
  }
  return bb;
}

function render() {
  const hasKey = !!st.cfg.key;
  $('#mode').textContent = hasKey ? 'LIVE DATA' : 'API KEY NEEDED';
  $('#mode').className = `tag ${hasKey ? 't-green' : 't-red'}`;
  $('#rem').textContent = 'Credits: ' + (st.rem ?? '—');

  $('#tabs').innerHTML = ['All', ...Object.keys(SP)].map(t =>
    `<button class="tab ${st.tab === t ? 'on' : ''}" onclick="st.tab='${t}';st.conf='';render()">${t}</button>`
  ).join('');

  $('#vb').classList.toggle('on', st.view === 'board');
  $('#vt').classList.toggle('on', st.view === 'bets');

  const isCol = st.tab === 'NCAAF' || st.tab === 'NCAAB';
  const confs = [...new Set(st.games.filter(g => g.s === st.tab && g.cf).map(g => g.cf))].sort();

  if (st.view === 'board' && hasKey) {
    $('#sub').innerHTML = `
      <label class="tab ${st.onlyEdges ? 'on' : ''}">
        <input type="checkbox" class="hidden" ${st.onlyEdges ? 'checked' : ''} onchange="st.onlyEdges=this.checked;render()">
        🔥 Strong Matchup Angles Only
      </label>
      ${isCol ? `
        <label class="tab ${st.rank ? 'on' : ''}">
          <input type="checkbox" class="hidden" ${st.rank ? 'checked' : ''} onchange="st.rank=this.checked;render()">Top 25 Only
        </label>
        <label class="tab ${st.power ? 'on' : ''}">
          <input type="checkbox" class="hidden" ${st.power ? 'checked' : ''} onchange="st.power=this.checked;render()">Power Conferences
        </label>
        <select class="!w-auto" onchange="st.conf=this.value;render()">
          <option value="">All Conferences</option>
          ${confs.map(c => `<option ${st.conf === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      ` : ''}
    `;
  } else {
    $('#sub').innerHTML = '';
  }

  st.view === 'board' ? rBoard() : rBets();
}

function rBoard() {
  if (!st.cfg.key) {
    $('#main').innerHTML = `
      <div class="card p-8 text-center max-w-lg mx-auto mt-6">
        <div class="text-3xl mb-2">🔑</div>
        <h2 class="text-lg font-bold mb-2">Connect Your Odds API Key</h2>
        <p class="text-sm text-slate-400 mb-4">Paste your key from <b>the-odds-api.com</b> to pull live spreads, moneylines, and totals merged with live ESPN team records, home/road splits, and weather.</p>
        <button class="tab on" onclick="openCfg()">Enter API Key</button>
      </div>`;
    return;
  }

  let gs = st.games.filter(g => st.tab === 'All' || g.s === st.tab);
  if (st.onlyEdges) gs = gs.filter(g => (g.angles || []).some(a => a.score >= 2));
  if (st.tab === 'NCAAF' || st.tab === 'NCAAB') {
    if (st.rank) gs = gs.filter(g => g.rk && (g.rk[0] || g.rk[1]));
    if (st.power) gs = gs.filter(g => POW.includes(g.cf));
    if (st.conf) gs = gs.filter(g => g.cf === st.conf);
  }

  $('#main').innerHTML =
    (st.err.length ? `<div class="card p-3 mb-3 border-red-800 bg-red-950/30 text-red-300 text-sm">${st.err.join('<br>')}</div>` : '') +
    (gs.length ? gs.map(renderCard).join('') : '<div class="card p-8 text-center text-slate-400">No upcoming games match these filters.</div>');
}

function renderCard(g) {
  const B = g.books;
  const e = g.e || {};
  const rk = g.rk || [];
  const isLiveOrFinal = e.state && e.state !== 'pre';
  const topAngles = (g.angles || []).filter(a => a.score >= 2);
  const isOpen = !!st.open[g.id];

  const bA = bestBook(B, b => b.ml && dec(b.ml[0]));
  const bH = bestBook(B, b => b.ml && dec(b.ml[1]));
  const sA = bestBook(B, b => b.sp && -b.sp[0] * 10 + dec(b.sp[1]));
  const sH = bestBook(B, b => b.sp && b.sp[0] * 10 + dec(b.sp[2]));
  const tO = bestBook(B, b => b.t && -b.t[0] * 10 + dec(b.t[1]));
  const tU = bestBook(B, b => b.t && b.t[0] * 10 + dec(b.t[2]));

  const teamRow = (name, rank, info, isHome) => `
    <div class="flex items-center justify-between py-1">
      <div class="flex items-center gap-2 min-w-0">
        ${info?.logo ? `<img src="${info.logo}" class="w-6 h-6 object-contain shrink-0" alt="">` : ''}
        ${rank ? `<span class="tag t-yellow shrink-0">#${rank}</span>` : ''}
        <span class="font-semibold truncate">${name}</span>
        ${info?.rec ? `<span class="text-xs text-slate-400 shrink-0">(${info.rec}${info.split ? `, ${isHome ? 'Home' : 'Road'} ${info.split}` : ''})</span>` : ''}
      </div>
      ${isLiveOrFinal && info?.sc != null ? `<span class="font-bold text-base ml-2">${info.sc}</span>` : ''}
    </div>`;

  const cell = (m, s, bk, txt, isBest) =>
    `<td class="p-1 text-center"><button class="odd-btn w-full ${isBest ? 'best-odd' : ''}" onclick="pick('${g.id}','${m}','${s}','${bk}')">${txt}</button></td>`;

  const rows = BK.filter(b => B[b]).map(b => {
    const v = B[b];
    return `
      <tr class="border-t border-slate-800/60">
        <td class="p-1 text-slate-400 font-semibold text-xs">${b}</td>
        ${v.ml ? cell('ml', 'a', b, fm(v.ml[0]), bA === b) + cell('ml', 'h', b, fm(v.ml[1]), bH === b) : '<td></td><td></td>'}
        ${v.sp ? cell('sp', 'a', b, `${ln(-v.sp[0])} <span class="opacity-75">${fm(v.sp[1])}</span>`, sA === b) + cell('sp', 'h', b, `${ln(v.sp[0])} <span class="opacity-75">${fm(v.sp[2])}</span>`, sH === b) : '<td></td><td></td>'}
        ${v.t ? cell('t', 'o', b, `O ${v.t[0]} <span class="opacity-75">${fm(v.t[1])}</span>`, tO === b) + cell('t', 'u', b, `U ${v.t[0]} <span class="opacity-75">${fm(v.t[2])}</span>`, tU === b) : '<td></td><td></td>'}
      </tr>`;
  }).join('');

  const spreadLabel = { NFL: 'Spread', NCAAF: 'Spread', NCAAB: 'Spread', NHL: 'Puck Line', MLB: 'Run Line' }[g.s];

  return `
    <div class="card p-4 mb-3">
      <!-- Top Meta Bar -->
      <div class="flex flex-wrap items-center gap-2 text-xs mb-2">
        <span class="tag t-blue font-bold">${g.s}</span>
        ${g.cf ? `<span class="tag t-slate">${g.cf}</span>` : ''}
        <span class="text-slate-400 font-medium">${e.st || g.tm}</span>
        ${e.venue ? `<span class="text-slate-500 hidden sm:inline">· ${e.venue}</span>` : ''}
        ${topAngles.length ? `<span class="tag t-green ml-auto">🔥 ${topAngles.length} Matchup Edge${topAngles.length > 1 ? 's' : ''}</span>` : ''}
      </div>

      <!-- Teams & Records -->
      <div class="grid sm:grid-cols-2 gap-x-6 border-b border-slate-800 pb-2 mb-2">
        ${teamRow(g.a, rk[0], e.a, false)}
        ${teamRow(g.h, rk[1], e.h, true)}
      </div>

      <!-- Highlighted Top Angles Preview -->
      ${topAngles.length ? `
        <div class="flex flex-wrap gap-1.5 mb-3">
          ${topAngles.map(a => `<span class="tag ${a.type}">${a.text}</span>`).join('')}
        </div>
      ` : ''}

      <!-- Odds Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <tr class="text-[11px] uppercase tracking-wider text-slate-500">
            <th class="text-left p-1 w-12">Book</th>
            <th class="text-center p-1">Away ML</th>
            <th class="text-center p-1">Home ML</th>
            <th class="text-center p-1">Away ${spreadLabel}</th>
            <th class="text-center p-1">Home ${spreadLabel}</th>
            <th class="text-center p-1">Over</th>
            <th class="text-center p-1">Under</th>
          </tr>
          ${rows}
        </table>
      </div>

      <!-- Expandable Full Matchup Breakdown -->
      <div class="mt-2 pt-2 border-t border-slate-800/80 flex items-center justify-between">
        <button class="text-xs text-blue-400 hover:text-blue-300 font-medium" onclick="st.open['${g.id}']=!st.open['${g.id}'];render()">
          ${isOpen ? '▲ Hide full matchup notes' : `▼ View all matchup angles (${(g.angles || []).length})`}
        </button>
        <span class="text-[11px] text-slate-500">Green = best available number</span>
      </div>

      ${isOpen ? `
        <div class="mt-2 pt-2 flex flex-wrap gap-1.5">
          ${(g.angles || []).map(a => `<span class="tag ${a.type}">${a.text}</span>`).join('')}
        </div>
      ` : ''}
    </div>`;
}

/* ---------- PICK SLIP (SPORTS-WATCHING CONVICTION) ---------- */
function pick(id, m, s, b) {
  const g = st.games.find(x => x.id === id);
  const v = g.books[b];
  let o, desc, line = null;
  if (m === 'ml') { o = v.ml[s === 'a' ? 0 : 1]; desc = `${s === 'a' ? g.a : g.h} ML`; }
  if (m === 'sp') { o = v.sp[s === 'a' ? 1 : 2]; line = s === 'a' ? -v.sp[0] : v.sp[0]; desc = `${s === 'a' ? g.a : g.h} ${ln(line)}`; }
  if (m === 't')  { o = v.t[s === 'o' ? 1 : 2]; line = v.t[0]; desc = `${g.a} @ ${g.h} ${s === 'o' ? 'Over' : 'Under'} ${line}`; }

  st.slip = { sport: g.s, desc: `${desc} [${b}]`, o };
  const el = $('#slip');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="flex justify-between items-center mb-2">
      <b class="text-base">Log Matchup Pick</b>
      <button class="text-slate-400 hover:text-white" onclick="$('#slip').classList.add('hidden')">✕</button>
    </div>
    <div class="p-2.5 rounded-lg bg-[#0b0f17] border border-slate-800 mb-3">
      <div class="font-semibold text-sm">${desc}</div>
      <div class="text-xs text-slate-400 mt-0.5">${g.s} · Best line at ${b} (${fm(o)})</div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="text-xs text-slate-400">Odds</label>
        <input id="so" type="number" value="${o}">
      </div>
      <div>
        <label class="text-xs text-slate-400">Conviction (Units)</label>
        <select id="su">
          <option value="0.5">0.5u (Lean)</option>
          <option value="1" selected>1.0u (Standard)</option>
          <option value="2">2.0u (Strong Play)</option>
          <option value="3">3.0u (Lock / Max)</option>
        </select>
      </div>
    </div>

    <label class="text-xs text-slate-400 block mb-1">Matchup Read / Why I Like This</label>
    <textarea id="snote" rows="2" placeholder="e.g., Home team dominates the trenches, road QB struggles outdoors..."></textarea>

    <button class="tab on w-full mt-3 !bg-green-600 hover:!bg-green-500 text-center" onclick="logBet()">Save Pick</button>
    <p id="smsg" class="text-xs text-green-400 mt-2 text-center"></p>
  `;
}

function logBet() {
  const o = +$('#so').value;
  const u = +$('#su').value;
  const note = $('#snote').value.trim();
  if (!o || !u) return;

  st.bets.push({
    id: Date.now(),
    d: new Date().toISOString().slice(0, 10),
    s: st.slip.sport,
    desc: st.slip.desc,
    odds: o,
    units: u,
    note,
    st: 'pending'
  });
  W('mb_bets', st.bets);
  $('#smsg').textContent = 'Saved to My Picks ✓';
  setTimeout(() => $('#slip').classList.add('hidden'), 900);
}

/* ---------- MY PICKS & PERFORMANCE ---------- */
const unitPL = b => b.st === 'win' ? b.units * (dec(b.odds) - 1) : b.st === 'loss' ? -b.units : 0;

function setB(id, f, v) {
  const b = st.bets.find(x => x.id === id);
  b[f] = v;
  W('mb_bets', st.bets);
  rBets();
}

function delB(id) {
  st.bets = st.bets.filter(b => b.id !== id);
  W('mb_bets', st.bets);
  rBets();
}

function rBets() {
  const sett = st.bets.filter(b => b.st !== 'pending');
  const netU = sett.reduce((a, b) => a + unitPL(b), 0);
  const riskedU = sett.reduce((a, b) => a + b.units, 0);
  const w = sett.filter(b => b.st === 'win').length;
  const l = sett.filter(b => b.st === 'loss').length;
  const uVal = st.cfg.unit || 25;

  const KPI = (lbl, val, cls = '') => `
    <div class="card p-3">
      <div class="text-xs text-slate-400">${lbl}</div>
      <div class="text-xl font-bold mt-0.5 ${cls}">${val}</div>
    </div>`;

  $('#main').innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
      ${KPI('Net Units', `${netU >= 0 ? '+' : ''}${netU.toFixed(2)}u`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Net Profit ($)', `${netU >= 0 ? '+' : '-'}$${Math.abs(netU * uVal).toFixed(0)}`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Win Rate', w + l ? `${(w / (w + l) * 100).toFixed(1)}%` : '–')}
      ${KPI('Record', `${w}-${l}`)}
    </div>

    <div class="card p-3 mb-3"><canvas id="ch" height="80"></canvas></div>

    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <tr class="text-xs text-slate-400 text-left border-b border-slate-800">
          <th class="p-2.5">Date</th>
          <th>Sport</th>
          <th>Pick & Matchup Note</th>
          <th>Odds</th>
          <th>Size</th>
          <th>Result</th>
          <th>P/L</th>
          <th></th>
        </tr>
        ${st.bets.slice().reverse().map(b => {
          const p = unitPL(b);
          return `
            <tr class="border-t border-slate-800/70">
              <td class="p-2.5 text-slate-400 text-xs whitespace-nowrap">${b.d}</td>
              <td><span class="tag t-blue">${b.s}</span></td>
              <td class="py-2">
                <div class="font-medium">${b.desc}</div>
                ${b.note ? `<div class="text-xs text-slate-400 italic">"${b.note}"</div>` : ''}
              </td>
              <td>${fm(b.odds)}</td>
              <td>${b.units}u</td>
              <td>
                <select class="!w-24 !py-1" onchange="setB(${b.id},'st',this.value)">
                  ${['pending', 'win', 'loss', 'push'].map(s => `<option ${b.st === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </td>
              <td class="font-semibold ${p > 0 ? 'text-green-400' : p < 0 ? 'text-red-400' : ''}">${p ? `${p > 0 ? '+' : ''}${p.toFixed(2)}u` : '–'}</td>
              <td><button class="text-slate-500 hover:text-red-400 px-2" onclick="delB(${b.id})">✕</button></td>
            </tr>`;
        }).join('') || '<tr><td colspan="8" class="p-6 text-center text-slate-400">No picks logged yet. Click any odd on the Matchups board to log a play.</td></tr>'}
      </table>
    </div>`;

  const sp = Object.keys(SP);
  const data = sp.map(s => st.bets.filter(b => b.s === s && b.st !== 'pending').reduce((a, b) => a + unitPL(b), 0));
  if (chart) chart.destroy();
  chart = new Chart($('#ch'), {
    type: 'bar',
    data: {
      labels: sp,
      datasets: [{
        label: 'Units Won / Lost by Sport',
        data,
        backgroundColor: data.map(v => v >= 0 ? '#22c55e' : '#ef4444'),
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e5e7eb' } } },
      scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
      }
    }
  });
}

/* ---------- SETTINGS MODAL ---------- */
function openCfg() {
  const c = st.cfg;
  const m = $('#modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  m.innerHTML = `
    <div class="card p-5 w-full max-w-md border-slate-700">
      <h2 class="font-bold text-lg mb-3">API & Board Setup</h2>

      <label class="text-xs text-slate-400">The Odds API Key (stored locally in browser)</label>
      <input id="k" type="password" value="${c.key}" placeholder="Paste your API key here">

      <p class="text-xs text-slate-400 mt-4 mb-1.5">Active Sports (1 credit per sport per sync; cached 15 mins)</p>
      <div class="flex flex-wrap gap-3 text-sm mb-4">
        ${Object.keys(SP).map(s => `
          <label class="flex gap-1.5 items-center cursor-pointer">
            <input type="checkbox" class="!w-auto" id="on_${s}" ${c.on[s] ? 'checked' : ''}>${s}
          </label>
        `).join('')}
      </div>

      <div class="mb-4">
        <label class="text-xs text-slate-400">Standard Unit Size ($)</label>
        <input id="un" type="number" value="${c.unit}">
      </div>

      <div class="flex gap-2 justify-end">
        <button class="tab" onclick="closeCfg()">Cancel</button>
        <button class="tab on" onclick="saveCfg()">Save & Sync Live Data</button>
      </div>
    </div>`;
}

function closeCfg() {
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}

function saveCfg() {
  const on = {};
  Object.keys(SP).forEach(s => on[s] = $('#on_' + s).checked ? 1 : 0);
  st.cfg = {
    key: $('#k').value.trim(),
    live: true,
    on,
    unit: +$('#un').value || 25
  };
  W('mb_cfg', st.cfg);
  closeCfg();
  load(true);
}

load();
</script>
</body>
</html>
