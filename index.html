const dec = o => o > 0 ? 1 + o / 100 : 1 + 100 / -o;

const ln = n => n > 0 ? '+' + n : '' + n;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

async function cached(k, fn, ttl = 9e5) {
  const c = S('gp_c_' + k, null);
  if (c && Date.now() - c.t < ttl) return c.d;
  const d = await fn();
  W('gp_c_' + k, { t: Date.now(), d });
  return d;
}

/* ---------- FETCH ODDS (UPCOMING GAMES ONLY) ---------- */
async function oddsFetch(sp) {
  // commenceTimeFrom filters out games that have already started or finished
  const nowIso = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
  const u = `https://api.the-odds-api.com/v4/sports/${SP[sp].k}/odds/?apiKey=${encodeURIComponent(st.cfg.key)}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm&commenceTimeFrom=${nowIso}`;
  const res = await fetch(u);
  if (!res.ok) {
    if (res.status === 401) throw new Error('Invalid API Key — check Settings.');
    if (res.status === 429) throw new Error('Odds API rate limit or out of credits.');
    throw new Error(`${sp}: Odds API Error ${res.status}`);
  }
  const rm = res.headers.get('x-requests-remaining');
  if (rm != null) { st.rem = rm; W('gp_rem', rm); }
  const j = await res.json();
  return j
    .filter(e => new Date(e.commence_time).getTime() > Date.now())
    .map(e => {
      const g = {
        id: e.id,
        s: sp,
        a: e.away_team,
        h: e.home_team,
        ts: e.commence_time,
        tm: new Date(e.commence_time).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
        books: {}
      };
      e.bookmakers.forEach(b => {
        const n = BN[b.key];
        if (!n) return;
        const o = {};
        b.markets.forEach(m => {
          const A = m.outcomes.find(x => x.name === e.away_team);
          const H = m.outcomes.find(x => x.name === e.home_team);
          if (m.key === 'h2h' && A && H) o.ml = [A.price, H.price];
          if (m.key === 'spreads' && A && H) o.sp = [H.point, A.price, H.price];
          if (m.key === 'totals') {
            const ov = m.outcomes.find(x => x.name === 'Over');
            const un = m.outcomes.find(x => x.name === 'Under');
            if (ov && un) o.t = [ov.point, ov.price, un.price];
          }
        });
        g.books[n] = o;
      });
      return g;
    });
}

/* ---------- FETCH ON-DEMAND EVENT PROPS ---------- */
async function loadProps(gameId) {
  st.openProps[gameId] = !st.openProps[gameId];
  if (!st.openProps[gameId]) { render(); return; }
  if (st.propsData[gameId]) { render(); return; }

  const g = st.games.find(x => x.id === gameId);
  if (!g) return;

  if (!st.cfg.key || g.sample) {
    st.propsData[gameId] = getSampleProps(g);
    render();
    return;
  }

  st.propsLoading[gameId] = true;
  render();

  try {
    const markets = SP[g.s].propMarkets;
    const raw = await cached('props_' + gameId, async () => {
      const u = `https://api.the-odds-api.com/v4/sports/${SP[g.s].k}/events/${gameId}/odds?apiKey=${encodeURIComponent(st.cfg.key)}&regions=us&markets=${markets}&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm`;
      const res = await fetch(u);
      if (!res.ok) throw new Error(`Props unavailable (${res.status})`);
      const rm = res.headers.get('x-requests-remaining');
      if (rm != null) { st.rem = rm; W('gp_rem', rm); }
      return res.json();
    }, 12e5);

    st.propsData[gameId] = parseAndScoreProps(g, raw);
  } catch (err) {
    st.propsData[gameId] = { error: err.message };
  } finally {
    st.propsLoading[gameId] = false;
    render();
  }
}

function parseAndScoreProps(g, raw) {
  const map = {};
  (raw.bookmakers || []).forEach(b => {
    const bk = BN[b.key];
    if (!bk) return;
    (b.markets || []).forEach(m => {
      (m.outcomes || []).forEach(o => {
        const player = o.description || o.name;
        const side = o.description ? o.name : 'Yes';
        if (side === 'No') return;
        const line = o.point ?? null;
        const key = `${m.key}|${player}|${side}|${line}`;
        if (!map[key]) {
          map[key] = { market: m.key, player, side, line, books: {}, bestOdds: -99999, bestBook: bk };
        }
        map[key].books[bk] = o.price;
        if (dec(o.price) > dec(map[key].bestOdds)) {
          map[key].bestOdds = o.price;
          map[key].bestBook = bk;
        }
      });
    });
  });

  const e = g.e || {};
  const firstBook = Object.values(g.books)[0] || {};
  const total = firstBook.t ? firstBook.t[0] : null;
  const homeSpread = firstBook.sp ? firstBook.sp[0] : null;
  const isWindy = !e.indoor && /wind/i.test(e.weather || '');
  const leaderText = [...(e.a?.leaders || []), ...(e.h?.leaders || [])].join(' ').toLowerCase();

  return Object.values(map).map(p => {
    let conf = 58;
    let badge = { text: '📊 Standard Line', cls: 't-slate' };
    const reasons = [];

    const lastName = p.player.split(' ').pop().toLowerCase();
    const isLeader = lastName.length > 2 && leaderText.includes(lastName);
    if (isLeader) {
      conf += 10;
      badge = { text: '⭐ Team Leader', cls: 't-blue' };
      reasons.push('Featured team stat leader in this matchup');
    }

    if (g.s === 'NFL' || g.s === 'NCAAF') {
      const highTotal = total && total >= (g.s === 'NFL' ? 47.5 : 56.5);
      if (p.market === 'player_anytime_td') {
        if (highTotal) {
          conf += 12;
          badge = { text: '⚡ Shootout TD', cls: 't-green' };
          reasons.push(`High game total (${total}) projects multiple red-zone trips`);
        } else if (p.bestOdds >= 110 && p.bestOdds <= 240) {
          conf += 8;
          badge = { text: '💰 Plus-Money TD', cls: 't-purple' };
          reasons.push(`Strong plus-money payout (${fm(p.bestOdds)}) on ${p.bestBook}`);
        }
      }
      if (isWindy && p.market === 'player_rush_yds' && p.side === 'Over') {
        conf += 14;
        badge = { text: '🌬️ Wind Script', cls: 't-green' };
        reasons.push(`Outdoor wind (${e.weather}) boosts rushing volume`);
      }
      if (isWindy && p.market === 'player_pass_yds' && p.side === 'Under') {
        conf += 13;
        badge = { text: '🌬️ Weather Fade', cls: 't-orange' };
        reasons.push(`Windy conditions (${e.weather}) limit deep passing efficiency`);
      }
      if (homeSpread != null && Math.abs(homeSpread) >= 6.5 && p.market === 'player_rush_yds' && p.side === 'Over') {
        conf += 8;
        badge = { text: '🎯 Game Script', cls: 't-green' };
        reasons.push('Near-TD or bigger spread favors late-game clock control');
      }
    }

    if (g.s === 'NHL' && total && total >= 6.5 && (p.market === 'player_goal_scorer_anytime' || p.market === 'player_points')) {
      conf += 11;
      badge = { text: '⚡ High-Pace 6.5', cls: 't-purple' };
      reasons.push('High 6.5 goal total boosts top-line scoring volume');
    }

    const bookPrices = Object.values(p.books);
    if (bookPrices.length >= 2) {
      const spreadDiff = Math.max(...bookPrices.map(dec)) - Math.min(...bookPrices.map(dec));
      if (spreadDiff >= 0.12) {
        conf += 6;
        reasons.push(`Line-shopping edge: ${p.bestBook} offers ${fm(p.bestOdds)}`);
      }
    }

    if (!reasons.length) reasons.push(`Best available price at ${p.bestBook} (${fm(p.bestOdds)})`);
    return { ...p, confidence: clamp(conf, 50, 92), badge, reason: reasons.join('. ') + '.' };
  }).sort((a, b) => b.confidence - a.confidence);
}

/* ---------- FETCH ESPN SCOREBOARD + STANDINGS ---------- */
async function espnFetch(sp) {
  const c = SP[sp];
  return cached('espn_' + sp, async () => {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${c.e}/scoreboard?limit=300` + (c.g ? `&groups=${c.g}` : ''));
    const j = await res.json();
    return (j.events || []).map(ev => {
      const comp = ev.competitions[0];
      const cp = comp.competitors;
      const parseTeam = side => {
        const q = cp.find(x => x.homeAway === side);
        const t = q.team;
        const recs = q.records || [];
        const overall = (recs.find(r => r.type === 'total') || recs[0] || {}).summary || '';
        const split = (recs.find(r => r.type === (side === 'home' ? 'home' : 'road')) || {}).summary || '';
        const leaders = (q.leaders || []).slice(0, 2).map(l =>
          `${l.shortDisplayName}: ${l.leaders?.[0]?.athlete?.shortName} (${l.leaders?.[0]?.displayValue})`
        );
        return {
          id: t.id,
          n: t.displayName,
          short: t.shortDisplayName || t.name,
          loc: t.location || '',
          logo: t.logo,
          sc: q.score,
          cf: t.conferenceId,
          rk: q.curatedRank && q.curatedRank.current > 0 && q.curatedRank.current <= 25 ? q.curatedRank.current : null,
          rec: overall,
          split,
          leaders
        };
      };
      return {
        h: parseTeam('home'),
        a: parseTeam('away'),
        date: ev.date,
        st: ev.status.type.shortDetail,
        state: ev.status.type.state,
        venue: comp.venue?.fullName || '',
        indoor: comp.venue?.indoor ?? false,
        weather: ev.weather?.displayValue || '',
        temp: ev.weather?.temperature || null
      };
    });
  }, 6e5);
}

/* ---------- FIXED STANDINGS FETCH (TRUE PER-GAME AVERAGES) ---------- */
async function standingsFetch(sp) {
  const c = SP[sp];
  return cached('stand_v2_' + sp, async () => {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/v2/sports/${c.e}/standings`);
      const j = await res.json();
      const map = {};
      const walk = node => {
        if (node.standings?.entries) {
          node.standings.entries.forEach(ent => {
            const id = ent.team?.id;
            if (!id) return;
            const stMap = {};
            const strMap = {};
            (ent.stats || []).forEach(s => {
              stMap[s.name] = Number(s.value);
              strMap[s.name] = s.displayValue;
            });
            const gp = stMap.gamesPlayed || ((stMap.wins || 0) + (stMap.losses || 0) + (stMap.ties || 0) + (stMap.otLosses || 0));
            const ppg = stMap.avgPointsFor || (gp > 0 && stMap.pointsFor ? stMap.pointsFor / gp : null);
            const papg = stMap.avgPointsAgainst || (gp > 0 && stMap.pointsAgainst ? stMap.pointsAgainst / gp : null);
            map[id] = {
              ppg,
              papg,
              streak: strMap.streak || ''
            };
          });
        }
        (node.children || []).forEach(walk);
      };
      walk(j);
      return map;
    } catch {
      return {};
    }
  }, 18e5);
}

const AL = {
  uconn: 'connecticut', 'ole miss': 'mississippi', usc: 'southern california', pitt: 'pittsburgh',
  umass: 'massachusetts', ucf: 'central florida', smu: 'southern methodist', tcu: 'texas christian',
  byu: 'brigham young', unlv: 'nevada las vegas', lsu: 'louisiana state', vcu: 'virginia commonwealth',
  'miami fl': 'miami', 'miami (fl)': 'miami', saint: 'st', 'st.': 'st'
};
const nz = s => {
  s = (s || '').toLowerCase().replace(/[’']/g, '').replace(/[.&]/g, m => m === '.' ? '' : ' ').replace(/[()-]/g, ' ');
  for (const k in AL) s = s.replace(new RegExp('\\b' + k.replace(/[.()]/g, '') + '\\b', 'g'), AL[k]);
  return s.replace(/\bstate\b/g, 'st').replace(/\bsaint\b/g, 'st').replace(/\s+/g, ' ').trim();
};
const sim = (a, t) => {
  const A = nz(a).split(' '), B = nz(t.n).split(' ');
  const i = A.filter(x => B.includes(x)).length;
  const s1 = i / Math.max(A.length, B.length);
  const L = nz(t.loc);
  return Math.max(s1, L && nz(a).startsWith(L) ? .9 : 0);
};

function parseRec(r) {
  if (!r) return null;
  const p = r.split('-').map(Number);
  if (p.length < 2 || isNaN(p[0]) || isNaN(p[1])) return null;
  const tot = p[0] + p[1] + (p[2] || 0);
  return { w: p[0], l: p[1], pct: tot ? p[0] / tot : 0, gp: tot };
}

function bestLine(books, market, side) {
  let best = null;
  for (const b of BK) {
    const v = books[b];
    if (!v) continue;
    if (market === 'ml' && v.ml) {
      const odds = v.ml[side === 'a' ? 0 : 1];
      if (!best || dec(odds) > dec(best.odds)) best = { book: b, odds, point: null };
    }
    if (market === 'sp' && v.sp) {
      const point = side === 'a' ? -v.sp[0] : v.sp[0];
      const odds = v.sp[side === 'a' ? 1 : 2];
      const score = point * 10 + dec(odds);
      if (!best || score > best.score) best = { book: b, odds, point, score };
    }
    if (market === 't' && v.t) {
      const point = v.t[0];
      const odds = v.t[side === 'o' ? 1 : 2];
      const score = (side === 'o' ? -point : point) * 10 + dec(odds);
      if (!best || score > best.score) best = { book: b, odds, point, score };
    }
  }
  return best;
}

/* ---------- SPORTS EXPERT HANDICAPPING ENGINE ---------- */
function generateRecommendation(g) {
  const e = g.e;
  const firstBook = Object.values(g.books)[0] || {};
  const homeSpread = firstBook.sp ? firstBook.sp[0] : null;
  const total = firstBook.t ? firstBook.t[0] : null;
  const bestOver = bestLine(g.books, 't', 'o');
  const bestUnder = bestLine(g.books, 't', 'u');

  if (!e) {
    const fallback = bestLine(g.books, 'ml', 'h');
    return {
      tier: 'pass',
      confidence: 45,
      sideConf: 45,
      totalConf: 45,
      badges: [{ text: '⏳ Future Slate', cls: 't-slate' }],
      pickTitle: 'Upcoming Game — Matchup Stats Pending',
      reason: 'Sportsbook lines are posted, but team efficiency stats have not synced for this future date yet.',
      bet: fallback ? { market: 'ml', side: 'h', label: `${g.h} ML`, ...fallback } : null,
      bestOver,
      bestUnder
    };
  }

  const aRoad = parseRec(e.a.split);
  const hHome = parseRec(e.h.split);
  const aSt = e.a.standings || {};
  const hSt = e.h.standings || {};
  const aStreak = e.a.streak || aSt.streak || '';
  const hStreak = e.h.streak || hSt.streak || '';

  let homeEdge = 0;
  let awayEdge = 0;
  let overEdge = 0;
  let underEdge = 0;
  const homeReasons = [];
  const awayReasons = [];
  const totalReasons = [];
  const badges = [];

  // 1. Spread-Adjusted Power & Scoring Efficiency (True Per-Game Rates)
  if (aSt.ppg && hSt.ppg && aSt.papg && hSt.papg) {
    const aNet = Number(aSt.ppg) - Number(aSt.papg);
    const hNet = Number(hSt.ppg) - Number(hSt.papg);
    const hfa = g.s === 'NFL' ? 2.0 : g.s === 'NCAAF' ? 2.8 : g.s === 'NHL' ? 0.25 : 0.35;
    const projHomeMargin = (hNet - aNet) + hfa;
    const marketHomeMargin = homeSpread != null ? -homeSpread : 0;
    const spreadValue = projHomeMargin - marketHomeMargin;

    const thresh = (g.s === 'NFL' || g.s === 'NCAAF') ? 3.5 : 0.65;
    if (homeSpread != null && spreadValue >= thresh) {
      homeEdge += 3.0;
      homeReasons.push(`${e.h.short}'s per-game scoring margin (${hNet >= 0 ? '+' : ''}${hNet.toFixed(1)}/g) projects stronger than the ${ln(homeSpread)} line`);
    } else if (homeSpread != null && spreadValue <= -thresh) {
      awayEdge += 3.0;
      awayReasons.push(`${e.a.short}'s per-game scoring differential (${aNet >= 0 ? '+' : ''}${aNet.toFixed(1)}/g) holds clear line value vs. ${ln(-homeSpread)}`);
    }

    const projTotal = (Number(aSt.ppg) + Number(hSt.papg) + Number(hSt.ppg) + Number(aSt.papg)) / 2;
    const totThresh = g.s === 'NFL' ? 3.5 : g.s === 'NCAAF' ? 4.5 : g.s === 'NHL' ? 0.55 : 0.75;
    if (total && projTotal - total >= totThresh) {
      overEdge += 3.0;
      totalReasons.push(`Matchup pace & scoring rates project ~${projTotal.toFixed(1)} combined against a ${total} O/U`);
      badges.push({ text: '⚡ Shootout Script', cls: 't-purple' });
    } else if (total && total - projTotal >= totThresh) {
      underEdge += 3.0;
      totalReasons.push(`Defensive suppression & scoring rates project ~${projTotal.toFixed(1)} combined under the ${total} total`);
    }
  }

  // 2. Recent Momentum & Streaks
  const parseStreak = s => {
    const m = /^([WL])(\d+)$/i.exec(s);
    return m ? { type: m[1].toUpperCase(), len: Number(m[2]) } : null;
  };
  const aStr = parseStreak(aStreak);
  const hStr = parseStreak(hStreak);
  if (hStr && hStr.type === 'W' && hStr.len >= 3) {
    homeEdge += 1.5;
    homeReasons.push(`${e.h.short} enters in peak form on a ${hStreak} streak`);
  }
  if (aStr && aStr.type === 'W' && aStr.len >= 3) {
    awayEdge += 1.5;
    awayReasons.push(`${e.a.short} carries strong momentum on a ${aStreak} streak`);
  }
  if (hStr && hStr.type === 'L' && hStr.len >= 3) {
    awayEdge += 1.2;
    awayReasons.push(`fading ${e.h.short} amid a ${hStreak} slide`);
  }
  if (aStr && aStr.type === 'L' && aStr.len >= 3) {
    homeEdge += 1.2;
    homeReasons.push(`capitalizing on ${e.a.short}'s ${aStreak} slump`);
  }

  // 3. Venue Dominance & Road Vulnerability
  if (hHome && hHome.gp >= 4 && hHome.pct >= 0.72) {
    homeEdge += 1.8;
    homeReasons.push(`${e.h.short} dominates at home (${e.h.split})`);
  }
  if (aRoad && aRoad.gp >= 4 && aRoad.pct <= 0.30) {
    homeEdge += 1.8;
    homeReasons.push(`${e.a.short} struggles away (${e.a.split} road)`);
  } else if (aRoad && aRoad.gp >= 4 && aRoad.pct >= 0.68) {
    awayEdge += 1.8;
    awayReasons.push(`${e.a.short} thrives as a road team (${e.a.split})`);
  }

  // 4. Situational Spots
  if (g.s === 'NCAAF' && g.rk) {
    const [rkA, rkH] = g.rk;
    if (rkA && !rkH && homeSpread != null && homeSpread > 0 && homeSpread <= 6.5) {
      homeEdge += 2.2;
      homeReasons.push(`Ranked road trap spot: #${rkA} ${e.a.short} laying under a TD in a hostile road venue`);
      badges.push({ text: '🪤 Ranked Trap', cls: 't-orange' });
    }
  }
  if (g.cf && homeSpread != null && Math.abs(homeSpread) <= 3.5 && total != null) {
    underEdge += 1.5;
    totalReasons.push(`Tight ${g.cf} conference matchup (${ln(homeSpread)}) favors physical, clock-draining drives`);
    badges.push({ text: '🔒 Conference Grinder', cls: 't-blue' });
  }

  // 5. Weather Impact
  const isOutdoor = !e.indoor;
  const hasWindOrPrecip = isOutdoor && /wind|rain|snow|storm|gust/i.test(e.weather || '');
  if (hasWindOrPrecip && total != null) {
    underEdge += 2.8;
    totalReasons.push(`Outdoor weather (${[e.weather, e.temp ? e.temp + '°F' : ''].filter(Boolean).join(', ')}) disrupts passing/kicking and favors the Under`);
    badges.push({ text: '🌬️ Weather Edge', cls: 't-orange' });
  }

  const sideDiff = Math.abs(homeEdge - awayEdge);
  const topSideEdge = Math.max(homeEdge, awayEdge);
  const topTotalEdge = Math.max(overEdge, underEdge);

  const sideConf = clamp(Math.round(50 + topSideEdge * 6.5 + sideDiff * 2.5), 50, 94);
  const totalConf = clamp(Math.round(50 + topTotalEdge * 7.5), 50, 94);

  if (topTotalEdge >= 2.8 && topTotalEdge >= topSideEdge && total != null) {
    const isOver = overEdge >= underEdge;
    const b = isOver ? bestOver : bestUnder;
    if (b) {
      const isStrong = totalConf >= 75;
      badges.unshift({ text: isStrong ? '🔥 High Conviction' : '👍 Solid Lean', cls: isStrong ? 't-green' : 't-blue' });
      return {
        tier: isStrong ? 'strong' : 'lean',
        confidence: totalConf,
        sideConf,
        totalConf,
        badges: badges.slice(0, 3),
        pickTitle: `TAKE ${isOver ? 'OVER' : 'UNDER'} ${b.point} (${fm(b.odds)} at ${b.book})`,
        reason: totalReasons.slice(0, 3).join('. ') + '.',
        bet: { market: 't', side: isOver ? 'o' : 'u', label: `${g.a} @ ${g.h} ${isOver ? 'Over' : 'Under'} ${b.point}`, ...b },
        bestOver,
        bestUnder
      };
    }
  }

  if (topSideEdge >= 2.2 && sideDiff >= 1.2) {
    const pickHome = homeEdge > awayEdge;
    const team = pickHome ? e.h : e.a;
    const fullTeam = pickHome ? g.h : g.a;
    const reasons = pickHome ? homeReasons : awayReasons;
    const sideCode = pickHome ? 'h' : 'a';

    const spLine = bestLine(g.books, 'sp', sideCode);
    const mlLine = bestLine(g.books, 'ml', sideCode);

    let chosen = spLine;
    let pickText = spLine ? `${team.short} ${ln(spLine.point)} (${fm(spLine.odds)} at ${spLine.book})` : '';

    if (mlLine && mlLine.odds >= 105 && mlLine.odds <= 225) {
      chosen = mlLine;
      pickText = `${team.short} Moneyline (${fm(mlLine.odds)} at ${mlLine.book})`;
      badges.unshift({ text: '💎 Plus-Money Dog', cls: 't-purple' });
    } else if (spLine && spLine.point > 0) {
      badges.unshift({ text: '🛡️ Live Underdog', cls: 't-blue' });
    } else if (spLine && Math.abs(spLine.point) >= 13.5 && mlLine && mlLine.odds >= -320) {
      chosen = mlLine;
      pickText = `${team.short} Moneyline (${fm(mlLine.odds)} at ${mlLine.book})`;
      badges.unshift({ text: '🧱 Chalk Anchor', cls: 't-green' });
    } else if (spLine && spLine.point < 0) {
      badges.unshift({ text: '🎯 Favorite Value', cls: 't-green' });
    }

    const isStrong = sideConf >= 75;
    badges.unshift({ text: isStrong ? '🔥 High Conviction' : '👍 Solid Lean', cls: isStrong ? 't-green' : 't-blue' });

    if (chosen) {
      const extraContext = e.a.leaders?.[0] && e.h.leaders?.[0]
        ? ` Key matchup: ${e.a.short}'s ${e.a.leaders[0]} vs. ${e.h.short}'s ${e.h.leaders[0]}.`
        : '';
      return {
        tier: isStrong ? 'strong' : 'lean',
        confidence: sideConf,
        sideConf,
        totalConf,
        badges: badges.slice(0, 3),
        pickTitle: `PICK: ${pickText}`,
        reason: reasons.slice(0, 3).join('. ') + '.' + extraContext,
        bet: { market: chosen.point != null ? 'sp' : 'ml', side: sideCode, label: `${fullTeam} ${chosen.point != null ? ln(chosen.point) : 'ML'}`, ...chosen },
        bestOver,
        bestUnder
      };
    }
  }

  const leanHome = (homeSpread ?? 0) < 0;
  const fallbackSide = leanHome ? 'h' : 'a';
  const fallbackBet = bestLine(g.books, 'sp', fallbackSide) || bestLine(g.books, 'ml', fallbackSide);
  return {
    tier: 'pass',
    confidence: Math.max(sideConf, totalConf),
    sideConf,
    totalConf,
    badges: [{ text: '⚖️ Toss-Up / Pass', cls: 't-slate' }],
    pickTitle: 'No Clear Matchup Edge — Tight Line',
    reason: `${e.a.short} (${e.a.rec || 'N/A'}) and ${e.h.short} (${e.h.rec || 'N/A'}) grade out evenly against the posted ${homeSpread != null ? ln(homeSpread) + ' spread' : 'line'}. Check Player Props or pass.`,
    bet: fallbackBet ? { market: fallbackBet.point != null ? 'sp' : 'ml', side: fallbackSide, label: `${leanHome ? g.h : g.a} ${fallbackBet.point != null ? ln(fallbackBet.point) : 'ML'}`, ...fallbackBet } : null,
    bestOver,
    bestUnder
  };
}

/* ---------- PARALLEL LOAD PIPELINE (PRE-GAME ONLY) ---------- */
async function load(force) {
  if (force) Object.keys(localStorage).filter(k => k.startsWith('gp_c_')).forEach(k => localStorage.removeItem(k));
  st.err = [];
  $('#main').innerHTML = `<div class="card p-10 text-center text-slate-400">Analyzing upcoming matchups, per-game efficiency, streaks, and sportsbook lines…</div>`;

  if (!st.cfg.key) {
    st.games = getSampleGames();
    render();
    return;
  }

  const enabledSports = Object.keys(SP).filter(sp => st.cfg.on[sp]);
  const results = await Promise.all(enabledSports.map(async sp => {
    try {
      const [oddsGames, espnGames, standingsMap] = await Promise.all([
        cached('odds_v2_' + sp, () => oddsFetch(sp)),
        espnFetch(sp).catch(() => []),
        standingsFetch(sp).catch(() => ({}))
      ]);

      const upcoming = [];
      oddsGames.forEach(g => {
        // Double-check start time is still in the future
        if (new Date(g.ts).getTime() <= Date.now()) return;

        let best = null, bs = 0;
        espnGames.forEach(e => {
          const s = (sim(g.a, e.a) + sim(g.h, e.h)) / 2;
          if (s > bs) { bs = s; best = e; }
        });

        if (best && bs >= 0.5) {
          // Skip games that ESPN marks as in-progress ('in') or completed ('post')
          if (best.state && best.state !== 'pre') return;

          g.e = best;
          g.e.a.standings = standingsMap[best.a.id] || {};
          g.e.h.standings = standingsMap[best.h.id] || {};
          g.rk = [best.a.rk, best.h.rk];
          const m = CF[sp];
          if (m) {
            const hConf = m[best.h.cf] || '';
            const aConf = m[best.a.cf] || '';
            g.cf = POW.includes(hConf) ? hConf : POW.includes(aConf) ? aConf : (hConf || aConf);
          }
        }
        g.rec = generateRecommendation(g);
        upcoming.push(g);
      });
      return upcoming;
    } catch (e) {
      st.err.push(e.message);
      return [];
    }
  }));

  st.games = results.flat().sort((a, b) => new Date(a.ts) - new Date(b.ts));
  render();
}

  return `
    <div class="card p-4 mb-4">
      <div class="flex flex-wrap items-center gap-2 text-xs mb-3">
        <span class="tag t-blue">${g.s}</span>
        ${g.cf ? `<span class="tag t-slate">${g.cf}</span>` : ''}
        <span class="text-slate-300 font-medium">${g.tm}</span>
        ${e.venue ? `<span class="text-slate-500">· ${e.venue}</span>` : ''}
        ${!e.indoor && (e.weather || e.temp) ? `<span class="tag t-yellow ml-auto">🌤️ ${[e.weather, e.temp ? e.temp + '°F' : ''].filter(Boolean).join(', ')}</span>` : ''}
      </div>

      <div class="grid sm:grid-cols-2 gap-2.5 mb-3">
        ${teamBlock(g.a, rk[0], e.a, false)}
        ${teamBlock(g.h, rk[1], e.h, true)}
      </div>

      <!-- EXPERT CALLOUT & CONFIDENCE SCALE -->
      <div class="${boxClass} p-3.5">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
          <div class="flex flex-wrap items-center gap-1.5">
            ${(rec.badges || []).map(b => `<span class="tag ${b.cls}">${b.text}</span>`).join('')}
            <span class="font-bold text-base text-white ml-1">${rec.pickTitle}</span>
          </div>
          ${rec.bet ? `
            <button class="btn on !py-1 !px-3 text-xs !bg-green-600 hover:!bg-green-500" onclick="openSlip('${g.id}')">
              + Log Main Pick
            </button>
          ` : ''}
        </div>

        <p class="text-sm text-slate-200 leading-relaxed mb-3">${rec.reason}</p>

        <!-- DUAL CONFIDENCE SCALE + QUICK O/U LOGGERS -->
        <div class="grid sm:grid-cols-2 gap-3 pt-2.5 border-t border-slate-700/60 items-center">
          <div class="space-y-1.5">
            ${confBar('Side', rec.sideConf)}
            ${confBar('O/U', rec.totalConf)}
          </div>
          <div class="flex flex-wrap sm:justify-end gap-1.5">
            ${rec.bestOver ? `
              <button class="btn !py-1 !px-2.5 text-xs border border-slate-700" onclick="openCustomSlip('${g.id}', 'Over ${rec.bestOver.point}', '${rec.bestOver.book}', ${rec.bestOver.odds}, 'Game Total Over (${rec.totalConf}% O/U Confidence)')">
                + Over ${rec.bestOver.point} (${fm(rec.bestOver.odds)} ${rec.bestOver.book})
              </button>` : ''}
            ${rec.bestUnder ? `
              <button class="btn !py-1 !px-2.5 text-xs border border-slate-700" onclick="openCustomSlip('${g.id}', 'Under ${rec.bestUnder.point}', '${rec.bestUnder.book}', ${rec.bestUnder.odds}, 'Game Total Under (${rec.totalConf}% O/U Confidence)')">
                + Under ${rec.bestUnder.point} (${fm(rec.bestUnder.odds)} ${rec.bestUnder.book})
              </button>` : ''}
          </div>
        </div>
      </div>

      <!-- ACTION BAR: PROPS & LINE COMPARISON -->
      <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
        <button class="btn ${showProps ? 'on' : ''} !py-1.5 !px-3 text-xs" onclick="loadProps('${g.id}')">
          🎯 ${showProps ? 'Hide Props & Anytime TD' : 'Player Props & Anytime TD'}
        </button>
        <button class="text-xs text-slate-400 hover:text-slate-200" onclick="st.openOdds['${g.id}']=!st.openOdds['${g.id}'];render()">
          ${showOdds ? '▲ Hide sportsbook lines' : '▼ Compare DK / FD / MGM lines'}
        </button>
      </div>

      ${showProps ? renderPropsDrawer(g) : ''}

      ${showOdds ? `
        <div class="mt-2.5 overflow-x-auto rounded-lg border border-slate-800">
          <table class="w-full">
            <tr class="bg-[#0b0f17] text-[11px] text-slate-400">
              <th class="text-left p-1.5">Book</th>
              <th class="p-1.5">Moneyline (Away / Home)</th>
              <th class="p-1.5">Home Spread</th>
              <th class="p-1.5">Game Total (O / U)</th>
            </tr>
            ${rows}
          </table>
        </div>
      ` : ''}
    </div>`;
}

function renderPropsDrawer(g) {
  if (st.propsLoading[g.id]) {
    return `<div class="mt-3 p-4 rounded-lg bg-[#0b0f17] border border-slate-800 text-xs text-slate-400 text-center">Fetching live player props & Anytime TD lines (1 batched credit)…</div>`;
  }
  const pData = st.propsData[g.id];
  if (!pData) return '';
  if (pData.error) {
    return `<div class="mt-3 p-3 rounded-lg bg-red-950/30 border border-red-800 text-xs text-red-300">${pData.error}</div>`;
  }
  if (!pData.length) {
    return `<div class="mt-3 p-3 rounded-lg bg-[#0b0f17] border border-slate-800 text-xs text-slate-400">No player props posted yet for this game.</div>`;
  }

  const availableMarkets = ['ALL', ...new Set(pData.map(p => p.market))];
  const activeFilter = st.propFilter[g.id] || 'ALL';
  const filtered = activeFilter === 'ALL' ? pData : pData.filter(p => p.market === activeFilter);

  return `
    <div class="mt-3 p-3 rounded-lg bg-[#0b0f17] border border-slate-800">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
        <div class="flex flex-wrap gap-1">
          ${availableMarkets.map(m => `
            <button class="btn !py-1 !px-2 text-[11px] ${activeFilter === m ? 'on' : ''}" onclick="st.propFilter['${g.id}']='${m}';render()">
              ${m === 'ALL' ? 'All Props' : (PROP_LABELS[m] || m)}
            </button>
          `).join('')}
        </div>
        <span class="text-[11px] text-slate-500">Sorted by Script Confidence</span>
      </div>

      <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
        ${filtered.slice(0, 20).map(p => {
          const mLabel = PROP_LABELS[p.market] || p.market;
          const propDesc = p.line != null ? `${p.player} ${p.side} ${p.line} ${mLabel}` : `${p.player} ${mLabel}`;
          const confColor = p.confidence >= 78 ? 'text-green-400' : p.confidence >= 68 ? 'text-blue-400' : 'text-slate-300';
          return `
            <div class="p-2.5 rounded-lg bg-[#121826] border border-slate-800/90 flex flex-wrap items-center justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
                  <span class="tag ${p.badge.cls}">${p.badge.text}</span>
                  <span class="font-bold text-sm text-white">${propDesc}</span>
                  <span class="text-xs font-bold ${confColor}">(${p.confidence}% Conf)</span>
                </div>
                <div class="text-xs text-slate-400">${p.reason}</div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <div class="text-right text-[11px] text-slate-400">
                  ${BK.filter(b => p.books[b] != null).map(b => `<span class="${b === p.bestBook ? 'text-green-400 font-bold' : ''}">${b}: ${fm(p.books[b])}</span>`).join(' · ')}
                </div>
                <button class="btn on !py-1 !px-2.5 text-xs !bg-green-700 hover:!bg-green-600" onclick="openCustomSlip('${g.id}', '${propDesc.replace(/'/g, "\\'")}', '${p.bestBook}', ${p.bestOdds}, '${p.reason.replace(/'/g, "\\'")}')">
                  + ${fm(p.bestOdds)}
                </button>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

/* ---------- LOG PICK DRAWER ---------- */
function openSlip(id) {
  const g = st.games.find(x => x.id === id);
  const rec = g?.rec;
  if (!rec?.bet) return;
  openCustomSlip(id, rec.bet.label, rec.bet.book, rec.bet.odds, rec.reason);
}

function openCustomSlip(gameId, label, book, odds, reason) {
  const g = st.games.find(x => x.id === gameId);
  if (!g) return;
  const fullLabel = label.includes(g.a) || label.includes(g.h) ? label : `${g.a} @ ${g.h} — ${label}`;

  st.slip = { sport: g.s, desc: `${fullLabel} [${book}]`, o: odds, reason };
  const el = $('#slip');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="flex justify-between items-center mb-2">
      <b class="text-base">Log Play</b>
      <button class="text-slate-400 hover:text-white" onclick="$('#slip').classList.add('hidden')">✕</button>
    </div>
    <div class="p-2.5 rounded-lg bg-[#0b0f17] border border-slate-800 mb-3">
      <div class="font-bold text-sm text-green-400">${fullLabel}</div>
      <div class="text-xs text-slate-400 mt-0.5">${g.s} · ${fm(odds)} at ${book}</div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="text-xs text-slate-400">Odds</label>
        <input id="so" type="number" value="${odds}">
      </div>
      <div>
        <label class="text-xs text-slate-400">Bet Size (Units)</label>
        <select id="su">
          <option value="0.5">0.5u (Lean / Prop)</option>
          <option value="1" selected>1.0u (Standard)</option>
          <option value="2">2.0u (High Conviction)</option>
          <option value="3">3.0u (Max Play)</option>
        </select>
      </div>
    </div>

    <label class="text-xs text-slate-400 block mb-1">Matchup / Script Reason</label>
    <textarea id="snote" rows="3">${reason}</textarea>

    <button class="btn on w-full mt-3 !bg-green-600 hover:!bg-green-500 text-center" onclick="logBet()">Save to My Record</button>
    <p id="smsg" class="text-xs text-green-400 mt-2 text-center"></p>
  `;
}

function logBet() {
  const o = +$('#so').value;
  const u = +$('#su').value;
  const note = $('#snote').value.trim();
  if (!o || !u) return;

  st.bets.push({
    id: Date.now(),
    d: new Date().toISOString().slice(0, 10),
    s: st.slip.sport,
    desc: st.slip.desc,
    odds: o,
    units: u,
    note,
    st: 'pending'
  });
  W('gp_bets', st.bets);
  $('#smsg').textContent = 'Saved ✓';
  setTimeout(() => $('#slip').classList.add('hidden'), 800);
}

/* ---------- MY RECORD ---------- */
const unitPL = b => b.st === 'win' ? b.units * (dec(b.odds) - 1) : b.st === 'loss' ? -b.units : 0;

function setB(id, f, v) {
  const b = st.bets.find(x => x.id === id);
  b[f] = v;
  W('gp_bets', st.bets);
  rBets();
}

function delB(id) {
  st.bets = st.bets.filter(b => b.id !== id);
  W('gp_bets', st.bets);
  rBets();
}

function rBets() {
  const sett = st.bets.filter(b => b.st !== 'pending');
  const netU = sett.reduce((a, b) => a + unitPL(b), 0);
  const w = sett.filter(b => b.st === 'win').length;
  const l = sett.filter(b => b.st === 'loss').length;
  const uVal = st.cfg.unit || 25;

  const KPI = (lbl, val, cls = '') => `
    <div class="card p-3">
      <div class="text-xs text-slate-400">${lbl}</div>
      <div class="text-xl font-bold mt-0.5 ${cls}">${val}</div>
    </div>`;

  $('#main').innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
      ${KPI('Net Units', `${netU >= 0 ? '+' : ''}${netU.toFixed(2)}u`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Net Profit ($)', `${netU >= 0 ? '+' : '-'}$${Math.abs(netU * uVal).toFixed(0)}`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Win Rate', w + l ? `${(w / (w + l) * 100).toFixed(1)}%` : '–')}
      ${KPI('Record', `${w}-${l}`)}
    </div>

    <div class="card p-3 mb-3"><canvas id="ch" height="75"></canvas></div>

    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <tr class="text-xs text-slate-400 text-left border-b border-slate-800">
          <th class="p-2.5">Date</th>
          <th>Sport</th>
          <th>Pick & Matchup Reason</th>
          <th>Odds</th>
          <th>Size</th>
          <th>Result</th>
          <th>P/L</th>
          <th></th>
        </tr>
        ${st.bets.slice().reverse().map(b => {
          const p = unitPL(b);
          return `
            <tr class="border-t border-slate-800/70">
              <td class="p-2.5 text-slate-400 text-xs whitespace-nowrap">${b.d}</td>
              <td><span class="tag t-blue">${b.s}</span></td>
              <td class="py-2 pr-2">
                <div class="font-semibold">${b.desc}</div>
                ${b.note ? `<div class="text-xs text-slate-400 mt-0.5">${b.note}</div>` : ''}
              </td>
              <td>${fm(b.odds)}</td>
              <td>${b.units}u</td>
              <td>
                <select class="!w-24 !py-1" onchange="setB(${b.id},'st',this.value)">
                  ${['pending', 'win', 'loss', 'push'].map(s => `<option ${b.st === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </td>
              <td class="font-semibold ${p > 0 ? 'text-green-400' : p < 0 ? 'text-red-400' : ''}">${p ? `${p > 0 ? '+' : ''}${p.toFixed(2)}u` : '–'}</td>
              <td><button class="text-slate-500 hover:text-red-400 px-2" onclick="delB(${b.id})">✕</button></td>
            </tr>`;
        }).join('') || '<tr><td colspan="8" class="p-6 text-center text-slate-400">No picks logged yet.</td></tr>'}
      </table>
    </div>`;

  const sp = Object.keys(SP);
  const data = sp.map(s => st.bets.filter(b => b.s === s && b.st !== 'pending').reduce((a, b) => a + unitPL(b), 0));
  if (chart) chart.destroy();
  chart = new Chart($('#ch'), {
    type: 'bar',
    data: {
      labels: sp,
      datasets: [{
        label: 'Units Won / Lost by Sport',
        data,
        backgroundColor: data.map(v => v >= 0 ? '#22c55e' : '#ef4444'),
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e5e7eb' } } },
      scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
      }
    }
  });
}

/* ---------- SETTINGS ---------- */
function openCfg() {
  const c = st.cfg;
  const m = $('#modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  m.innerHTML = `
    <div class="card p-5 w-full max-w-md border-slate-700">
      <h2 class="font-bold text-lg mb-3">API & Sports Setup</h2>

      <label class="text-xs text-slate-400">The Odds API Key</label>
      <input id="k" type="password" value="${c.key}" placeholder="Paste key from the-odds-api.com">

      <p class="text-xs text-slate-400 mt-4 mb-1.5">Sports to Analyze</p>
      <div class="flex flex-wrap gap-3 text-sm mb-4">
        ${Object.keys(SP).map(s => `
          <label class="flex gap-1.5 items-center cursor-pointer">
            <input type="checkbox" class="!w-auto" id="on_${s}" ${c.on[s] ? 'checked' : ''}>${s}
          </label>
        `).join('')}
      </div>

      <div class="mb-4">
        <label class="text-xs text-slate-400">1 Unit Value ($)</label>
        <input id="un" type="number" value="${c.unit}">
      </div>

      <div class="flex gap-2 justify-end">
        <button class="btn" onclick="closeCfg()">Cancel</button>
        <button class="btn on" onclick="saveCfg()">Save & Load Picks</button>
      </div>
    </div>`;
}

function closeCfg() {
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}

function saveCfg() {
  const on = {};
  Object.keys(SP).forEach(s => on[s] = $('#on_' + s).checked ? 1 : 0);
  st.cfg = {
    key: $('#k').value.trim(),
    on,
    unit: +$('#un').value || 25
  };
  W('gp_cfg', st.cfg);
  closeCfg();
  load(true);
}

load();
</script>
</body>
</html>
