async function cached(k, fn, ttl = 9e5) {
  const c = S('gp_c_' + k, null);

  const d = await fn();

}

/* ---------- TEAM NAME NORMALIZATION ---------- */
const AL = {
  uconn: 'connecticut', 'ole miss': 'mississippi', usc: 'southern california', pitt: 'pittsburgh',
  umass: 'massachusetts', ucf: 'central florida', smu: 'southern methodist', tcu: 'texas christian',
  byu: 'brigham young', unlv: 'nevada las vegas', lsu: 'louisiana state', vcu: 'virginia commonwealth',
  'miami fl': 'miami', 'miami (fl)': 'miami', saint: 'st', 'st.': 'st',
  'ny jets': 'new york jets', 'ny giants': 'new york giants', 'la rams': 'los angeles rams', 'la chargers': 'los angeles chargers'
};
const nz = s => {
  s = (s || '').toLowerCase().replace(/[’']/g, '').replace(/[.&]/g, m => m === '.' ? '' : ' ').replace(/[()-]/g, ' ');
  for (const k in AL) s = s.replace(new RegExp('\\b' + k.replace(/[.()]/g, '') + '\\b', 'g'), AL[k]);
  return s.replace(/\bstate\b/g, 'st').replace(/\bsaint\b/g, 'st').replace(/\s+/g, ' ').trim();
};
const sim = (a, t) => {
  const nameB = typeof t === 'string' ? t : t.n;
  const locB = typeof t === 'string' ? '' : (t.loc || '');
  const A = nz(a).split(' '), B = nz(nameB).split(' ');
  const i = A.filter(x => B.includes(x)).length;
  const s1 = i / Math.max(A.length, B.length);
  const L = nz(locB);
  return Math.max(s1, L && nz(a).startsWith(L) ? .9 : 0);
};

/* ---------- ELITE DATA SOURCE 1: OFFICIAL MLB STATS API (PROBABLE PITCHERS & STATS) ---------- */
async function mlbOfficialFetch() {
  return cached('mlb_official_v1', async () => {
    try {
      const today = new Date();
      const end = new Date(today.getTime() + 3 * 86400000);
      const fmtDate = d => d.toISOString().slice(0, 10);
      const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${fmtDate(today)}&endDate=${fmtDate(end)}&hydrate=probablePitcher(note),team,linescore,weather`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const j = await res.json();
      const games = [];
      (j.dates || []).forEach(dt => {
        (dt.games || []).forEach(gm => {
          if (gm.status?.abstractGameState !== 'Preview') return;
          const aTeam = gm.teams?.away || {};
          const hTeam = gm.teams?.home || {};
          games.push({
            awayName: aTeam.team?.name || '',
            homeName: hTeam.team?.name || '',
            awayRec: aTeam.leagueRecord ? `${aTeam.leagueRecord.wins}-${aTeam.leagueRecord.losses}` : '',
            homeRec: hTeam.leagueRecord ? `${hTeam.leagueRecord.wins}-${hTeam.leagueRecord.losses}` : '',
            awayPitcher: aTeam.probablePitcher ? {
              id: aTeam.probablePitcher.id,
              name: aTeam.probablePitcher.fullName,
              note: aTeam.probablePitcher.note || ''
            } : null,
            homePitcher: hTeam.probablePitcher ? {
              id: hTeam.probablePitcher.id,
              name: hTeam.probablePitcher.fullName,
              note: hTeam.probablePitcher.note || ''
            } : null,
            venue: gm.venue?.name || '',
            weather: gm.weather ? `${gm.weather.condition || ''}, ${gm.weather.temp || ''}°F, Wind ${gm.weather.wind || ''}` : ''
          });
        });
      });

      // Hydrate season pitching stats for probable starters in one batch call
      const pitcherIds = [...new Set(games.flatMap(g => [g.awayPitcher?.id, g.homePitcher?.id]).filter(Boolean))];
      if (pitcherIds.length) {
        const yr = new Date().getFullYear();
        const pRes = await fetch(`https://statsapi.mlb.com/api/v1/people?personIds=${pitcherIds.join(',')}&hydrate=stats(group=[pitching],type=[season],season=${yr})`);
        if (pRes.ok) {
          const pj = await pRes.json();
          const pMap = {};
          (pj.people || []).forEach(p => {
            const stat = p.stats?.[0]?.splits?.[0]?.stat;
            if (stat) {
              pMap[p.id] = {
                era: Number(stat.era) || null,
                whip: Number(stat.whip) || null,
                k9: Number(stat.strikeoutsPer9Inn) || null,
                ip: Number(stat.inningsPitched) || 0,
                hand: p.pitchHand?.code || ''
              };
            }
          });
          games.forEach(g => {
            if (g.awayPitcher && pMap[g.awayPitcher.id]) Object.assign(g.awayPitcher, pMap[g.awayPitcher.id]);
            if (g.homePitcher && pMap[g.homePitcher.id]) Object.assign(g.homePitcher, pMap[g.homePitcher.id]);
          });
        }
      }
      st.feedStatus.MLB = 'MLB Stats API (Pitchers)';
      return games;
    } catch {
      return null;
    }
  }, 9e5);
}

/* ---------- ELITE DATA SOURCE 2: OFFICIAL NHL STATS API (5v5, L10, REST DAYS) ---------- */
async function nhlOfficialFetch() {
  return cached('nhl_official_v1', async () => {
    try {
      const [standRes, schedRes] = await Promise.all([
        fetch('https://api-web.nhle.com/v1/standings/now'),
        fetch('https://api-web.nhle.com/v1/schedule/now')
      ]);
      if (!standRes.ok) return null;
      const sj = await standRes.json();
      const teamStats = {};
      (sj.standings || []).forEach(t => {
        const name = t.teamName?.default || '';
        const abbrev = t.teamAbbrev?.default || '';
        const gp = Number(t.gamesPlayed) || 1;
        teamStats[nz(name)] = {
          abbrev,
          gp,
          ppg: Number(t.goalFor) / gp,
          papg: Number(t.goalAgainst) / gp,
          goalDiffPg: Number(t.goalDifferentialPctg) || ((Number(t.goalFor) - Number(t.goalAgainst)) / gp),
          l10: `${t.l10Wins}-${t.l10Losses}-${t.l10OtLosses}`,
          l10PtsPct: ((t.l10Wins * 2 + t.l10OtLosses) / 20),
          homeRec: `${t.homeWins}-${t.homeLosses}-${t.homeOtLosses}`,
          roadRec: `${t.roadWins}-${t.roadLosses}-${t.roadOtLosses}`,
          streak: `${t.streakCode || ''}${t.streakCount || ''}`
        };
      });

      // Detect Back-to-Back games from official NHL schedule
      const playedDates = {};
      if (schedRes.ok) {
        const scj = await schedRes.json();
        (scj.gameWeek || []).forEach(day => {
          (day.games || []).forEach(gm => {
            if (gm.gameState === 'FINAL' || gm.gameState === 'OFF' || gm.gameState === 'LIVE' || gm.gameState === 'CRIT') {
              const dt = new Date(day.date + 'T12:00:00Z').getTime();
              [gm.awayTeam?.abbrev, gm.homeTeam?.abbrev].forEach(ab => {
                if (ab && (!playedDates[ab] || dt > playedDates[ab])) playedDates[ab] = dt;
              });
            }
          });
        });
      }

      st.feedStatus.NHL = 'NHL Official API';
      return { teamStats, playedDates };
    } catch {
      return null;
    }
  }, 9e5);
}

/* ---------- ELITE DATA SOURCE 3: NFLVERSE EPA/PLAY & EFFICIENCY FEED ---------- */
async function nflverseFetch() {
  return cached('nflverse_epa_v1', async () => {
    try {
      const yr = new Date().getMonth() >= 8 ? new Date().getFullYear() : new Date().getFullYear() - 1;
      const url = `https://github.com/nflverse/nflverse-data/releases/download/team_stats/stats_team_reg_${yr}.csv`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const csv = await res.text();
      const lines = csv.trim().split('\n');
      if (lines.length < 2) return null;
      const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
      const idx = name => headers.indexOf(name);

      const iTeam = idx('team');
      const iPassEpa = idx('passing_epa');
      const iRushEpa = idx('rushing_epa');
      const iSacks = idx('sacks_suffered');
      if (iTeam === -1 || iPassEpa === -1) return null;

      const map = {};
      lines.slice(1).forEach(line => {
        const cols = line.split(',').map(c => c.replace(/"/g, '').trim());
        const tm = cols[iTeam];
        if (!tm) return;
        const passEpa = Number(cols[iPassEpa]) || 0;
        const rushEpa = Number(cols[iRushEpa]) || 0;
        map[tm] = {
          passEpa,
          rushEpa,
          totalOffEpa: passEpa + rushEpa,
          sacks: Number(cols[iSacks]) || 0
        };
      });
      st.feedStatus.NFL = 'nflverse EPA + ESPN';
      return map;
    } catch {
      return null;
    }
  }, 36e5);
}

/* ---------- ELITE DATA SOURCE 4: COLLEGEFOOTBALLDATA (CFBD SP+ & PPA) ---------- */
async function cfbdFetch() {
  if (!st.cfg.cfbdKey) return null;

      const res = await fetch(`https://api.collegefootballdata.com/ratings/sp?year=${yr}`, {
        headers: { Authorization: `Bearer ${st.cfg.cfbdKey}` }
      });
      if (!res.ok) return null;
      const arr = await res.json();
      const map = {};
      arr.forEach(t => {
        map[nz(t.team)] = {
          spOverall: t.rating,
          spOff: t.offense?.rating,
          spDef: t.defense?.rating,
          sos: t.sos
        };
      });
      st.feedStatus.NCAAF = 'CFBD SP+ Ratings';
      return map;
    } catch {
      return null;
    }
  }, 36e5);
}

/* ---------- FETCH ODDS (UPCOMING GAMES ONLY) ---------- */
async function oddsFetch(sp) {
  const nowIso = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
  const u = `https://api.the-odds-api.com/v4/sports/${SP[sp].k}/odds/?apiKey=${encodeURIComponent(st.cfg.key)}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm&commenceTimeFrom=${nowIso}`;
  const res = await fetch(u);
  if (!res.ok) {
    if (res.status === 401) throw new Error('Invalid Odds API Key — check Data Feeds.');
    if (res.status === 429) throw new Error('Odds API rate limit or out of credits.');
    throw new Error(`${sp}: Odds API Error ${res.status}`);
  }
  const rm = res.headers.get('x-requests-remaining');
  if (rm != null) { st.rem = rm; W('gp_rem', rm); }
  const j = await res.json();
  return j
    .filter(e => new Date(e.commence_time).getTime() > Date.now())
    .map(e => {
      const g = {
        id: e.id,
        s: sp,
        a: e.away_team,
        h: e.home_team,
        ts: e.commence_time,
        tm: new Date(e.commence_time).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }),
        books: {}
      };
      e.bookmakers.forEach(b => {
        const n = BN[b.key];
        if (!n) return;
        const o = {};
        b.markets.forEach(m => {
          const A = m.outcomes.find(x => x.name === e.away_team);
          const H = m.outcomes.find(x => x.name === e.home_team);
          if (m.key === 'h2h' && A && H) o.ml = [A.price, H.price];
          if (m.key === 'spreads' && A && H) o.sp = [H.point, A.price, H.price];
          if (m.key === 'totals') {
            const ov = m.outcomes.find(x => x.name === 'Over');
            const un = m.outcomes.find(x => x.name === 'Under');
            if (ov && un) o.t = [ov.point, ov.price, un.price];
          }
        });
        g.books[n] = o;
      });
      return g;
    });
}

/* ---------- FETCH ESPN BASELINE + INJURIES ---------- */
async function espnFetch(sp) {
  const c = SP[sp];
  return cached('espn_' + sp, async () => {
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${c.e}/scoreboard?limit=300` + (c.g ? `&groups=${c.g}` : ''));
    const j = await res.json();
    return (j.events || []).map(ev => {
      const comp = ev.competitions[0];
      const cp = comp.competitors;
      const parseTeam = side => {
        const q = cp.find(x => x.homeAway === side);
        const t = q.team;
        const recs = q.records || [];
        const overall = (recs.find(r => r.type === 'total') || recs[0] || {}).summary || '';
        const split = (recs.find(r => r.type === (side === 'home' ? 'home' : 'road')) || {}).summary || '';
        const leaders = (q.leaders || []).slice(0, 2).map(l =>
          `${l.shortDisplayName}: ${l.leaders?.[0]?.athlete?.shortName} (${l.leaders?.[0]?.displayValue})`
        );
        return {
          id: t.id,
          abbrev: t.abbreviation || '',
          n: t.displayName,
          short: t.shortDisplayName || t.name,
          loc: t.location || '',
          logo: t.logo,
          sc: q.score,
          cf: t.conferenceId,
          rk: q.curatedRank && q.curatedRank.current > 0 && q.curatedRank.current <= 25 ? q.curatedRank.current : null,
          rec: overall,
          split,
          leaders
        };
      };
      return {
        eventId: ev.id,
        h: parseTeam('home'),
        a: parseTeam('away'),
        date: ev.date,
        st: ev.status.type.shortDetail,
        state: ev.status.type.state,
        venue: comp.venue?.fullName || '',
        indoor: comp.venue?.indoor ?? false,
        weather: ev.weather?.displayValue || '',
        temp: ev.weather?.temperature || null
      };
    });
  }, 6e5);
}

async function espnStandingsFetch(sp) {
  const c = SP[sp];
  return cached('stand_v5_' + sp, async () => {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/v2/sports/${c.e}/standings`);
      const j = await res.json();
      const map = {};
      const walk = node => {
        if (node.standings?.entries) {
          node.standings.entries.forEach(ent => {
            const id = ent.team?.id;
            if (!id) return;
            const stMap = {};
            const strMap = {};
            (ent.stats || []).forEach(s => {
              stMap[s.name] = Number(s.value);
              strMap[s.name] = s.displayValue;
            });
            const gp = stMap.gamesPlayed || ((stMap.wins || 0) + (stMap.losses || 0) + (stMap.ties || 0) + (stMap.otLosses || 0));
            const ppg = stMap.avgPointsFor || (gp > 0 && stMap.pointsFor ? stMap.pointsFor / gp : null);
            const papg = stMap.avgPointsAgainst || (gp > 0 && stMap.pointsAgainst ? stMap.pointsAgainst / gp : null);
            map[id] = { gp, ppg, papg, streak: strMap.streak || '' };
          });
        }
        (node.children || []).forEach(walk);
      };
      walk(j);
      return map;
    } catch {
      return {};
    }
  }, 18e5);
}

async function fetchGameSummary(sp, espnEventId) {
  if (!espnEventId) return null;
  const c = SP[sp];
  return cached('sum_' + espnEventId, async () => {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${c.e}/summary?event=${espnEventId}`);
      if (!res.ok) return null;
      const j = await res.json();
      const injuries = (j.injuries || []).map(teamInj => {
        const outPlayers = (teamInj.injuries || [])
          .filter(i => /out|doubtful|ir|injured reserve/i.test(i.status || ''))
          .map(i => `${i.athlete?.shortName || 'Player'} (${i.status})`);
        return {
          teamId: teamInj.team?.id,
          teamName: teamInj.team?.displayName || '',
          keyOut: outPlayers
        };
      });
      return { injuries };
    } catch {
      return null;
    }
  }, 18e5);
}

/* ---------- FETCH & SCORE PLAYER PROPS ---------- */
async function loadProps(gameId) {
  st.openProps[gameId] = !st.openProps[gameId];
  if (!st.openProps[gameId]) { render(); return; }
  if (st.propsData[gameId]) { render(); return; }

  const g = st.games.find(x => x.id === gameId);
  if (!g) return;

  if (!st.cfg.key || g.sample) {
    st.propsData[gameId] = getSampleProps(g);
    render();
    return;
  }

  st.propsLoading[gameId] = true;
  render();

  try {
    const markets = SP[g.s].propMarkets;
    const [raw, summary] = await Promise.all([
      cached('props_' + gameId, async () => {
        const u = `https://api.the-odds-api.com/v4/sports/${SP[g.s].k}/events/${gameId}/odds?apiKey=${encodeURIComponent(st.cfg.key)}&regions=us&markets=${markets}&oddsFormat=american&bookmakers=draftkings,fanduel,betmgm`;
        const res = await fetch(u);
        if (!res.ok) throw new Error(`Props unavailable (${res.status})`);
        const rm = res.headers.get('x-requests-remaining');
        if (rm != null) { st.rem = rm; W('gp_rem', rm); }
        return res.json();
      }, 12e5),
      g.e?.eventId ? fetchGameSummary(g.s, g.e.eventId) : Promise.resolve(null)
    ]);

    if (summary) st.summaryData[gameId] = summary;
    st.propsData[gameId] = parseAndScoreProps(g, raw, summary);
  } catch (err) {
    st.propsData[gameId] = { error: err.message };
  } finally {
    st.propsLoading[gameId] = false;
    render();
  }
}

function parseAndScoreProps(g, raw, summary) {
  const map = {};
  (raw.bookmakers || []).forEach(b => {
    const bk = BN[b.key];
    if (!bk) return;
    (b.markets || []).forEach(m => {
      (m.outcomes || []).forEach(o => {
        const player = o.description || o.name;
        const side = o.description ? o.name : 'Yes';
        if (side === 'No') return;
        if (/d\/st|defense/i.test(player)) return;

        const line = o.point ?? null;
        const key = `${m.key}|${player}|${side}|${line}`;
        if (!map[key]) {
          map[key] = { market: m.key, player, side, line, books: {}, bestOdds: -99999, bestBook: bk };
        }
        map[key].books[bk] = o.price;
        if (dec(o.price) > dec(map[key].bestOdds)) {
          map[key].bestOdds = o.price;
          map[key].bestBook = bk;
        }
      });
    });
  });

  const e = g.e || {};
  const aSt = e.a?.standings || {};
  const hSt = e.h?.standings || {};
  const firstBook = Object.values(g.books)[0] || {};
  const total = firstBook.t ? firstBook.t[0] : null;
  const homeSpread = firstBook.sp ? firstBook.sp[0] : null;
  const isWindy = !e.indoor && /wind|gust/i.test(e.weather || '');
  const isPrecip = !e.indoor && /rain|snow|storm/i.test(e.weather || '');
  const leaderText = [...(e.a?.leaders || []), ...(e.h?.leaders || [])].join(' ').toLowerCase();

  const outListText = (summary?.injuries || [])
    .flatMap(x => x.keyOut || [])
    .join(' ')
    .toLowerCase();

  return Object.values(map)
    .filter(p => {
      const last = p.player.split(' ').pop().toLowerCase();
      return !(last.length > 3 && outListText.includes(last + ' (out'));
    })
    .map(p => {
      const impliedPct = (1 / dec(p.bestOdds)) * 100;
      let conf = Math.round(impliedPct * 0.90 + 10);
      let badge = { text: '📊 Standard Line', cls: 't-slate' };
      const reasons = [];

      const isLongshot = p.bestOdds >= 300;
      const isPlusMoney = p.bestOdds >= 100 && p.bestOdds < 300;
      const lastName = p.player.split(' ').pop().toLowerCase();

      if (lastName.length > 2 && leaderText.includes(lastName)) {
        conf += 9;
        badge = { text: '⭐ Featured Leader', cls: 't-blue' };
        reasons.push('Primary team stat leader in this matchup');
      }

      // MLB Probable Pitcher Integration on Strikeout & Batter Props
      if (g.s === 'MLB') {
        const pitchers = [e.a?.pitcher, e.h?.pitcher].filter(Boolean);
        const matchedPitcher = pitchers.find(pt => pt.name && pt.name.toLowerCase().includes(lastName));
        if (matchedPitcher && p.market === 'pitcher_strikeouts' && p.side === 'Over' && matchedPitcher.k9 >= 9.5) {
          conf += 12;
          badge = { text: `🔥 ${matchedPitcher.k9} K/9 Ace`, cls: 't-green' };
          reasons.push(`Confirmed starter ${matchedPitcher.name} averages ${matchedPitcher.k9} K/9 (${matchedPitcher.era} ERA)`);
        }
        const weakStarter = pitchers.find(pt => pt.era && pt.era >= 4.40);
        if (weakStarter && (p.market === 'batter_total_bases' || p.market === 'batter_hits') && p.side === 'Over') {
          conf += 8;
          badge = { text: '⚾ Pitcher Mismatch', cls: 't-green' };
          reasons.push(`Opposing starter ${weakStarter.name} carries a ${weakStarter.era} ERA / ${weakStarter.whip} WHIP`);
        }
      }

      if (g.s === 'NFL' || g.s === 'NCAAF') {
        const highTotal = total && total >= (g.s === 'NFL' ? 47.5 : 56.5);
        if (p.market === 'player_anytime_td') {
          if (isLongshot) {
            badge = { text: '🎰 Longshot Flyer', cls: 't-slate' };
            reasons.push(`High-variance TD flyer (${fm(p.bestOdds)})`);
          } else if (highTotal) {
            conf += 10;
            badge = { text: isPlusMoney ? '⚡ Shootout TD' : '🎯 Red-Zone Anchor', cls: isPlusMoney ? 't-purple' : 't-green' };
            reasons.push(`High ${total} game total projects multiple red-zone drives`);
          }
        }
        if ((isWindy || isPrecip) && p.market === 'player_rush_yds' && p.side === 'Over') {
          conf += 13;
          badge = { text: '🌬️ Weather Run Script', cls: 't-green' };
          reasons.push(`Outdoor weather (${e.weather}) shifts play-calling to the ground`);
        }
        if ((isWindy || isPrecip) && p.market === 'player_pass_yds' && p.side === 'Under') {
          conf += 12;
          badge = { text: '🌬️ Weather Pass Fade', cls: 't-orange' };
          reasons.push(`Outdoor weather (${e.weather}) limits passing efficiency`);
        }
        if (homeSpread != null && Math.abs(homeSpread) >= 6.5 && p.market === 'player_rush_yds' && p.side === 'Over') {
          conf += 9;
          badge = { text: '🏃 Clock-Control Script', cls: 't-green' };
          reasons.push(`Spread of ${Math.abs(homeSpread)} favors late clock-control carries`);
        }
      }

      if (g.s === 'NHL' && total && total >= 6.5 && (p.market === 'player_goal_scorer_anytime' || p.market === 'player_points') && !isLongshot) {
        conf += 10;
        badge = { text: '⚡ High-Event 6.5', cls: 't-purple' };
        reasons.push('High 6.5 total projects elevated top-6 scoring volume');
      }

      if (!reasons.length) reasons.push(`Best available line at ${p.bestBook} (${fm(p.bestOdds)})`);
      const maxCap = isLongshot ? 38 : isPlusMoney ? 69 : 89;
      return { ...p, confidence: clamp(conf, 15, maxCap), badge, reason: reasons.join('. ') + '.' };
    }).sort((a, b) => b.confidence - a.confidence);
}

function parseRec(r) {
  if (!r) return null;
  const p = r.split('-').map(Number);
  if (p.length < 2 || isNaN(p[0]) || isNaN(p[1])) return null;
  const tot = p[0] + p[1] + (p[2] || 0);
  return { w: p[0], l: p[1], pct: tot ? p[0] / tot : 0, gp: tot };
}

function bestLine(books, market, side) {
  let best = null;
  for (const b of BK) {
    const v = books[b];
    if (!v) continue;
    if (market === 'ml' && v.ml) {
      const odds = v.ml[side === 'a' ? 0 : 1];
      if (!best || dec(odds) > dec(best.odds)) best = { book: b, odds, point: null };
    }
    if (market === 'sp' && v.sp) {
      const point = side === 'a' ? -v.sp[0] : v.sp[0];
      const odds = v.sp[side === 'a' ? 1 : 2];
      const score = point * 10 + dec(odds);
      if (!best || score > best.score) best = { book: b, odds, point, score };
    }
    if (market === 't' && v.t) {
      const point = v.t[0];
      const odds = v.t[side === 'o' ? 1 : 2];
      const score = (side === 'o' ? -point : point) * 10 + dec(odds);
      if (!best || score > best.score) best = { book: b, odds, point, score };
    }
  }
  return best;
}

/* ---------- MULTI-SOURCE HANDICAPPING ENGINE ---------- */
function generateRecommendation(g) {
  const e = g.e;
  const spCfg = SP[g.s];
  const firstBook = Object.values(g.books)[0] || {};
  const homeSpread = firstBook.sp ? firstBook.sp[0] : null;
  const total = firstBook.t ? firstBook.t[0] : null;
  const bestOver = bestLine(g.books, 't', 'o');
  const bestUnder = bestLine(g.books, 't', 'u');

  if (!e) {
    const fallback = bestLine(g.books, 'ml', 'h');
    return {
      tier: 'pass',
      confidence: 45,
      sideConf: 45,
      totalConf: 45,
      badges: [{ text: '⏳ Future Slate', cls: 't-slate' }],
      pickTitle: 'Upcoming Game — Matchup Data Pending',
      reason: 'Sportsbook lines are posted, but team efficiency stats have not synced for this future date yet.',
      bet: fallback ? { market: 'ml', side: 'h', label: `${g.h} ML`, ...fallback } : null,
      bestOver,
      bestUnder
    };
  }

  const aRec = parseRec(e.a.rec);
  const hRec = parseRec(e.h.rec);
  const aRoad = parseRec(e.a.split);
  const hHome = parseRec(e.h.split);
  const aSt = e.a.standings || {};
  const hSt = e.h.standings || {};
  const aStreak = e.a.streak || aSt.streak || '';
  const hStreak = e.h.streak || hSt.streak || '';

  let homeEdge = 0;
  let awayEdge = 0;
  let overEdge = 0;
  let underEdge = 0;
  const homeReasons = [];
  const awayReasons = [];
  const totalReasons = [];
  const badges = [];

  // 1. Sample-Stabilized Scoring Efficiency + Advanced League Telemetry
  if (aSt.ppg && hSt.ppg && aSt.papg && hSt.papg) {
    const aGP = aSt.gp || aRec?.gp || spCfg.priorGP;
    const hGP = hSt.gp || hRec?.gp || spCfg.priorGP;
    const leagueAvg = (Number(aSt.ppg) + Number(hSt.ppg) + Number(aSt.papg) + Number(hSt.papg)) / 4;

    const stab = (val, gp) => (val * gp + leagueAvg * spCfg.priorGP) / (gp + spCfg.priorGP);
    const aOff = stab(Number(aSt.ppg), aGP);
    const aDef = stab(Number(aSt.papg), aGP);
    const hOff = stab(Number(hSt.ppg), hGP);
    const hDef = stab(Number(hSt.papg), hGP);

    let projHomeMargin = ((hOff - hDef) - (aOff - aDef)) + spCfg.hfa;
    let projTotal = ((aOff + hDef) / 2) + ((hOff + aDef) / 2);

    // NFL: Layer in nflverse EPA/play
    if (g.s === 'NFL' && e.a.epa && e.h.epa) {
      const epaDiffPerGame = (e.h.epa.totalOffEpa - e.a.epa.totalOffEpa) / Math.max(hGP, 1);
      projHomeMargin += epaDiffPerGame * 0.35;
      if (epaDiffPerGame >= 3.5) homeReasons.push(`${e.h.short} holds a clear nflverse EPA/game efficiency edge (+${epaDiffPerGame.toFixed(1)} EPA/g)`);
      if (epaDiffPerGame <= -3.5) awayReasons.push(`${e.a.short} holds a clear nflverse EPA/game efficiency edge (+${Math.abs(epaDiffPerGame).toFixed(1)} EPA/g)`);
    }

    // NCAAF: Layer in CFBD SP+ Ratings
    if (g.s === 'NCAAF' && e.a.sp && e.h.sp && e.a.sp.spOverall != null && e.h.sp.spOverall != null) {
      const spMargin = (e.h.sp.spOverall - e.a.sp.spOverall) + spCfg.hfa;
      projHomeMargin = (projHomeMargin + spMargin) / 2;
      if (spMargin - (-homeSpread) >= 4.0) homeReasons.push(`CFBD SP+ ratings project ${e.h.short} by ${spMargin.toFixed(1)} vs. ${ln(homeSpread)}`);
      if ((-homeSpread) - spMargin >= 4.0) awayReasons.push(`CFBD SP+ ratings project ${e.a.short} outperforming the ${ln(-homeSpread)} spread`);
    }

    // MLB: Layer in Official MLB Stats API Probable Starting Pitchers
    if (g.s === 'MLB' && e.a.pitcher?.era && e.h.pitcher?.era) {
      const eraDiff = e.a.pitcher.era - e.h.pitcher.era; // positive favors home pitcher
      projHomeMargin += eraDiff * 0.45;
      if (eraDiff >= 1.1) {
        homeEdge += 2.2;
        homeReasons.push(`Starting pitching edge: ${e.h.pitcher.name} (${e.h.pitcher.era.toFixed(2)} ERA) vs. ${e.a.pitcher.name} (${e.a.pitcher.era.toFixed(2)} ERA)`);
        badges.push({ text: '⚾ Ace Advantage', cls: 't-green' });
      } else if (eraDiff <= -1.1) {
        awayEdge += 2.2;
        awayReasons.push(`Starting pitching edge: ${e.a.pitcher.name} (${e.a.pitcher.era.toFixed(2)} ERA) vs. ${e.h.pitcher.name} (${e.h.pitcher.era.toFixed(2)} ERA)`);
        badges.push({ text: '⚾ Ace Advantage', cls: 't-green' });
      }

      const avgStarterEra = (e.a.pitcher.era + e.h.pitcher.era) / 2;
      if (avgStarterEra <= 3.15 && total != null) {
        underEdge += 2.4;
        totalReasons.push(`Pitchers' duel: ${e.a.pitcher.name} (${e.a.pitcher.era.toFixed(2)} ERA) vs. ${e.h.pitcher.name} (${e.h.pitcher.era.toFixed(2)} ERA)`);
        badges.push({ text: '🔥 Pitchers\' Duel', cls: 't-blue' });
      } else if (avgStarterEra >= 4.75 && total != null) {
        overEdge += 2.2;
        totalReasons.push(`Vulnerable starters (${e.a.pitcher.era.toFixed(2)} & ${e.h.pitcher.era.toFixed(2)} ERA) project early runs`);
      }
    }

    const marketHomeMargin = homeSpread != null ? -homeSpread : 0;
    const spreadEdge = projHomeMargin - marketHomeMargin;

    if (homeSpread != null && spreadEdge >= spCfg.spreadThresh) {
      homeEdge += 3.0;
      homeReasons.unshift(`${e.h.short}'s efficiency profile projects ${e.h.short} by ${projHomeMargin.toFixed(1)} vs. the ${ln(homeSpread)} line`);
    } else if (homeSpread != null && spreadEdge <= -spCfg.spreadThresh) {
      awayEdge += 3.0;
      awayReasons.unshift(`${e.a.short}'s efficiency profile outpaces the ${ln(-homeSpread)} number`);
    }

    if (total && projTotal - total >= spCfg.totThresh) {
      overEdge += 3.0;
      totalReasons.unshift(`Combined scoring rates project ~${projTotal.toFixed(1)} total against a ${total} O/U`);
      badges.push({ text: '⚡ Shootout Script', cls: 't-purple' });
    } else if (total && total - projTotal >= spCfg.totThresh) {
      underEdge += 3.0;
      totalReasons.unshift(`Defensive rates project ~${projTotal.toFixed(1)} combined under the ${total} total`);
      badges.push({ text: '🛡️ Defensive Battle', cls: 't-blue' });
    }
  }

  // 2. Rest Days & Back-to-Back Fatigue (NHL Official Schedule)
  if (g.s === 'NHL') {
    if (e.a.restDays === 0 && (e.h.restDays ?? 1) >= 1) {
      homeEdge += 2.2;
      homeReasons.push(`Rest advantage: ${e.a.short} playing on a road back-to-back (0 days rest) vs. rested ${e.h.short}`);
      badges.push({ text: '🔋 Rest Edge vs B2B', cls: 't-orange' });
    } else if (e.h.restDays === 0 && (e.a.restDays ?? 1) >= 1) {
      awayEdge += 1.8;
      awayReasons.push(`Rest advantage: ${e.h.short} playing on 0 days rest (back-to-back)`);
      badges.push({ text: '🔋 Fading B2B', cls: 't-orange' });
    }
  }

  // 3. Current Form, L10 & Streaks
  const parseStreak = s => {
    const m = /^([WL])(\d+)$/i.exec(s);
    return m ? { type: m[1].toUpperCase(), len: Number(m[2]) } : null;
  };
  const aStr = parseStreak(aStreak);
  const hStr = parseStreak(hStreak);
  if (hStr && hStr.type === 'W' && hStr.len >= 3) {
    homeEdge += 1.4;
    homeReasons.push(`${e.h.short} enters hot on a ${hStreak} streak${hSt.l10 ? ` (${hSt.l10} L10)` : ''}`);
  }
  if (aStr && aStr.type === 'W' && aStr.len >= 3) {
    awayEdge += 1.4;
    awayReasons.push(`${e.a.short} carries momentum on a ${aStreak} streak${aSt.l10 ? ` (${aSt.l10} L10)` : ''}`);
  }
  if (hStr && hStr.type === 'L' && hStr.len >= 3) {
    awayEdge += 1.2;
    awayReasons.push(`fading ${e.h.short} amid a ${hStreak} skid`);
  }
  if (aStr && aStr.type === 'L' && aStr.len >= 3) {
    homeEdge += 1.2;
    homeReasons.push(`fading ${e.a.short} amid a ${aStreak} slump`);
  }

  // 4. Venue Dominance & Road Vulnerability
  if (hHome && hHome.gp >= 4 && hHome.pct >= 0.72) {
    homeEdge += 1.6;
    homeReasons.push(`${e.h.short} dominates at home (${e.h.split})`);
  }
  if (aRoad && aRoad.gp >= 4 && aRoad.pct <= 0.30) {
    homeEdge += 1.6;
    homeReasons.push(`${e.a.short} struggles on the road (${e.a.split})`);
  } else if (aRoad && aRoad.gp >= 4 && aRoad.pct >= 0.68) {
    awayEdge += 1.6;
    awayReasons.push(`${e.a.short} excels away from home (${e.a.split})`);
  }

  // 5. Weather Impact
  const isOutdoor = !e.indoor;
  const hasWindOrPrecip = isOutdoor && /wind|rain|snow|storm|gust/i.test(e.weather || '');
  if (hasWindOrPrecip && total != null) {
    underEdge += 2.6;
    totalReasons.push(`Outdoor weather (${[e.weather, e.temp ? e.temp + '°F' : ''].filter(Boolean).join(', ')}) favors the Under`);
    badges.push({ text: '🌬️ Weather Edge', cls: 't-orange' });
  }

  const sideDiff = Math.abs(homeEdge - awayEdge);
  const topSideEdge = Math.max(homeEdge, awayEdge);
  const topTotalEdge = Math.max(overEdge, underEdge);

  const sideConf = clamp(Math.round(50 + topSideEdge * 6.0 + sideDiff * 2.3), 50, 94);
  const totalConf = clamp(Math.round(50 + topTotalEdge * 7.0), 50, 94);

  if (topTotalEdge >= 2.8 && topTotalEdge >= topSideEdge && total != null) {
    const isOver = overEdge >= underEdge;
    const b = isOver ? bestOver : bestUnder;
    if (b) {
      const isStrong = totalConf >= 75;
      badges.unshift({ text: isStrong ? '🔥 Strong Matchup Play' : '👍 Solid Lean', cls: isStrong ? 't-green' : 't-blue' });
      return {
        tier: isStrong ? 'strong' : 'lean',
        confidence: totalConf,
        sideConf,
        totalConf,
        badges: badges.slice(0, 3),
        pickTitle: `TAKE ${isOver ? 'OVER' : 'UNDER'} ${b.point} (${fm(b.odds)} at ${b.book})`,
        reason: totalReasons.slice(0, 3).join('. ') + '.',
        bet: { market: 't', side: isOver ? 'o' : 'u', label: `${g.a} @ ${g.h} ${isOver ? 'Over' : 'Under'} ${b.point}`, ...b },
        bestOver,
        bestUnder
      };
    }
  }

  if (topSideEdge >= 2.2 && sideDiff >= 1.2) {
    const pickHome = homeEdge > awayEdge;
    const team = pickHome ? e.h : e.a;
    const fullTeam = pickHome ? g.h : g.a;
    const reasons = pickHome ? homeReasons : awayReasons;
    const sideCode = pickHome ? 'h' : 'a';

    const spLine = bestLine(g.books, 'sp', sideCode);
    const mlLine = bestLine(g.books, 'ml', sideCode);

    let chosen = spLine;
    let pickText = spLine ? `${team.short} ${ln(spLine.point)} (${fm(spLine.odds)} at ${spLine.book})` : '';

    if ((g.s === 'NHL' || g.s === 'MLB') && mlLine && mlLine.odds >= -225) {
      chosen = mlLine;
      pickText = `${team.short} Moneyline (${fm(mlLine.odds)} at ${mlLine.book})`;
      badges.unshift({ text: '🎯 Straight-Up Edge', cls: 't-green' });
    } else if (mlLine && mlLine.odds >= 105 && mlLine.odds <= 220) {
      chosen = mlLine;
      pickText = `${team.short} Moneyline (${fm(mlLine.odds)} at ${mlLine.book})`;
      badges.unshift({ text: '🐕 Live Underdog ML', cls: 't-purple' });
    } else if (spLine && spLine.point > 0) {
      badges.unshift({ text: '🛡️ Live Underdog', cls: 't-blue' });
    } else if (spLine && Math.abs(spLine.point) >= 13.5 && mlLine && mlLine.odds >= -320) {
      chosen = mlLine;
      pickText = `${team.short} Moneyline (${fm(mlLine.odds)} at ${mlLine.book})`;
      badges.unshift({ text: '🧱 Dominant Favorite', cls: 't-green' });
    }

    const isStrong = sideConf >= 75;
    badges.unshift({ text: isStrong ? '🔥 Strong Matchup Play' : '👍 Solid Lean', cls: isStrong ? 't-green' : 't-blue' });

    if (chosen) {
      return {
        tier: isStrong ? 'strong' : 'lean',
        confidence: sideConf,
        sideConf,
        totalConf,
        badges: badges.slice(0, 3),
        pickTitle: `PICK: ${pickText}`,
        reason: reasons.slice(0, 3).join('. ') + '.',
        bet: { market: chosen.point != null ? 'sp' : 'ml', side: sideCode, label: `${fullTeam} ${chosen.point != null ? ln(chosen.point) : 'ML'}`, ...chosen },
        bestOver,
        bestUnder
      };
    }
  }

  const leanHome = (homeSpread ?? 0) < 0;
  const fallbackSide = leanHome ? 'h' : 'a';
  const fallbackBet = bestLine(g.books, 'sp', fallbackSide) || bestLine(g.books, 'ml', fallbackSide);
  return {
    tier: 'pass',
    confidence: Math.max(sideConf, totalConf),
    sideConf,
    totalConf,
    badges: [{ text: '⚖️ Even Matchup / Pass', cls: 't-slate' }],
    pickTitle: 'Evenly Matched — No Clear Side Edge',
    reason: `${e.a.short} (${e.a.rec || 'N/A'}) and ${e.h.short} (${e.h.rec || 'N/A'}) grade out evenly across efficiency, rest, and form. Check Player Props or pass.`,
    bet: fallbackBet ? { market: fallbackBet.point != null ? 'sp' : 'ml', side: fallbackSide, label: `${leanHome ? g.h : g.a} ${fallbackBet.point != null ? ln(fallbackBet.point) : 'ML'}`, ...fallbackBet } : null,
    bestOver,
    bestUnder
  };
}

/* ---------- MULTI-SOURCE PARALLEL LOAD PIPELINE ---------- */
async function load(force) {
  if (force) Object.keys(localStorage).filter(k => k.startsWith('gp_c_')).forEach(k => localStorage.removeItem(k));
  st.err = [];
  st.feedStatus = {};
  $('#main').innerHTML = `<div class="card p-10 text-center text-slate-400">Syncing Official NHL/MLB APIs, nflverse EPA, CFBD ratings, and sportsbook boards…</div>`;

  if (!st.cfg.key) {
    st.feedStatus = { NFL: 'nflverse + ESPN', MLB: 'MLB Stats API', NHL: 'NHL Official API', NCAAF: 'CFBD / ESPN' };
    st.games = getSampleGames();
    render();
    return;
  }

  const enabledSports = Object.keys(SP).filter(sp => st.cfg.on[sp]);
  const [nflEpaMap, nhlOfficial, mlbOfficial, cfbdMap] = await Promise.all([
    st.cfg.on.NFL ? nflverseFetch() : null,
    st.cfg.on.NHL ? nhlOfficialFetch() : null,
    st.cfg.on.MLB ? mlbOfficialFetch() : null,
    st.cfg.on.NCAAF ? cfbdFetch() : null
  ]);

  const results = await Promise.all(enabledSports.map(async sp => {
    try {
      const [oddsGames, espnGames, standingsMap] = await Promise.all([
        cached('odds_v5_' + sp, () => oddsFetch(sp)),
        espnFetch(sp).catch(() => []),
        espnStandingsFetch(sp).catch(() => ({}))
      ]);
      if (!st.feedStatus[sp]) st.feedStatus[sp] = 'ESPN + Odds API';

      const upcoming = [];
      oddsGames.forEach(g => {
        if (new Date(g.ts).getTime() <= Date.now()) return;

        let best = null, bs = 0;
        espnGames.forEach(e => {
          const s = (sim(g.a, e.a) + sim(g.h, e.h)) / 2;
          if (s > bs) { bs = s; best = e; }
        });

        if (best && bs >= 0.5) {
          if (best.state && best.state !== 'pre') return;

          g.e = best;
          g.e.a.standings = { ...(standingsMap[best.a.id] || {}) };
          g.e.h.standings = { ...(standingsMap[best.h.id] || {}) };
          g.rk = [best.a.rk, best.h.rk];

          // Enrich NFL with nflverse EPA
          if (sp === 'NFL' && nflEpaMap) {
            if (nflEpaMap[best.a.abbrev]) g.e.a.epa = nflEpaMap[best.a.abbrev];
            if (nflEpaMap[best.h.abbrev]) g.e.h.epa = nflEpaMap[best.h.abbrev];
          }

          // Enrich NCAAF with CFBD SP+
          if (sp === 'NCAAF' && cfbdMap) {
            if (cfbdMap[nz(best.a.loc)]) g.e.a.sp = cfbdMap[nz(best.a.loc)];
            if (cfbdMap[nz(best.h.loc)]) g.e.h.sp = cfbdMap[nz(best.h.loc)];
          }

          // Enrich NHL with Official NHL API stats & rest days
          if (sp === 'NHL' && nhlOfficial) {
            const aNhl = nhlOfficial.teamStats[nz(g.a)];
            const hNhl = nhlOfficial.teamStats[nz(g.h)];
            if (aNhl) {
              Object.assign(g.e.a.standings, aNhl);
              g.e.a.streak = aNhl.streak;
              g.e.a.split = aNhl.roadRec;
              const lastPlayed = nhlOfficial.playedDates[aNhl.abbrev];
              if (lastPlayed) {
                const diffDays = Math.floor((new Date(g.ts).getTime() - lastPlayed) / 86400000);
                g.e.a.restDays = Math.max(0, diffDays);
              }
            }
            if (hNhl) {
              Object.assign(g.e.h.standings, hNhl);
              g.e.h.streak = hNhl.streak;
              g.e.h.split = hNhl.homeRec;
              const lastPlayed = nhlOfficial.playedDates[hNhl.abbrev];
              if (lastPlayed) {
                const diffDays = Math.floor((new Date(g.ts).getTime() - lastPlayed) / 86400000);
                g.e.h.restDays = Math.max(0, diffDays);
              }
            }
          }

          // Enrich MLB with Official MLB Stats API Probable Starting Pitchers
          if (sp === 'MLB' && mlbOfficial) {
            const mGame = mlbOfficial.find(m => sim(g.a, m.awayName) >= 0.7 && sim(g.h, m.homeName) >= 0.7);
            if (mGame) {
              if (mGame.awayPitcher) g.e.a.pitcher = mGame.awayPitcher;
              if (mGame.homePitcher) g.e.h.pitcher = mGame.homePitcher;
              if (mGame.weather) g.e.weather = mGame.weather;
            }
          }

          const m = CF[sp];
          if (m) {
            const hConf = m[best.h.cf] || '';
            const aConf = m[best.a.cf] || '';
            g.cf = POW.includes(hConf) ? hConf : POW.includes(aConf) ? aConf : (hConf || aConf);
          }
        }
        g.rec = generateRecommendation(g);
        upcoming.push(g);
      });
      return upcoming;
    } catch (e) {
      st.err.push(e.message);
      return [];
    }
  }));

  st.games = results.flat().sort((a, b) => new Date(a.ts) - new Date(b.ts));
  render();
}

/* ---------- RENDER ---------- */
function setView(v) { st.view = v; render(); }

function confBar(label, val) {
  const color = val >= 75 ? 'bg-green-500' : val >= 64 ? 'bg-blue-500' : 'bg-slate-500';
  return `
    <div class="flex items-center gap-2 text-xs">
      <span class="text-slate-400 w-12 shrink-0">${label}</span>
      <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full ${color}" style="width:${val}%"></div>
      </div>
      <span class="font-bold text-slate-200 w-8 text-right">${val}%</span>
    </div>`;
}

function render() {
  const hasKey = !!st.cfg.key;
  $('#mode').textContent = hasKey ? 'MULTI-SOURCE LIVE' : 'SAMPLE PREVIEW';
  $('#mode').className = `tag ${hasKey ? 't-green' : 't-yellow'}`;
  $('#rem').textContent = hasKey ? `Credits: ${st.rem ?? '—'}` : 'Paste API Key for Live';

  $('#tabs').innerHTML = ['All', ...Object.keys(SP)].map(t =>
    `<button class="btn ${st.tab === t ? 'on' : ''}" onclick="st.tab='${t}';render()">${t === 'All' ? 'All Sports' : SP[t].label}</button>`
  ).join('');

  $('#vb').classList.toggle('on', st.view === 'board');
  $('#vt').classList.toggle('on', st.view === 'bets');

  const isCol = st.tab === 'NCAAF';
  if (st.view === 'board') {
    $('#sub').innerHTML = `
      <label class="btn ${st.onlyStrong ? 'on' : ''}">
        <input type="checkbox" class="hidden" ${st.onlyStrong ? 'checked' : ''} onchange="st.onlyStrong=this.checked;render()">
        🔥 Recommended Matchup Plays Only
      </label>
      ${isCol ? `
        <label class="btn ${st.rank ? 'on' : ''}">
          <input type="checkbox" class="hidden" ${st.rank ? 'checked' : ''} onchange="st.rank=this.checked;render()">Top 25 Ranked Only
        </label>
        <label class="btn ${st.power ? 'on' : ''}">
          <input type="checkbox" class="hidden" ${st.power ? 'checked' : ''} onchange="st.power=this.checked;render()">Power Conferences
        </label>
      ` : ''}
      <div class="ml-auto flex flex-wrap gap-1.5 text-[11px] text-slate-400">
        ${Object.entries(st.feedStatus).map(([k, v]) => `<span class="tag t-slate">${k}: ${v}</span>`).join('')}
      </div>
    `;
  } else {
    $('#sub').innerHTML = '';
  }

  st.view === 'board' ? rBoard() : rBets();
}

function rBoard() {
  let gs = st.games.filter(g => (st.tab === 'All' || g.s === st.tab) && new Date(g.ts).getTime() > Date.now());
  if (st.onlyStrong) gs = gs.filter(g => g.rec && g.rec.tier !== 'pass');
  if (st.tab === 'NCAAF') {
    if (st.rank) gs = gs.filter(g => g.rk && (g.rk[0] || g.rk[1]));
    if (st.power) gs = gs.filter(g => POW.includes(g.cf));
  }

  const topPicks = [...gs]
    .filter(g => g.rec && g.rec.tier !== 'pass')
    .sort((a, b) => b.rec.confidence - a.rec.confidence)
    .slice(0, 3);

  const banner = !st.cfg.key ? `
    <div class="card p-3.5 mb-4 border-yellow-700/60 bg-yellow-950/20 flex flex-wrap items-center justify-between gap-2">
      <div class="text-sm text-yellow-200">
        <b>Viewing Sample Matchups:</b> Click <b>⚙ Data Feeds</b> to paste your Odds API key (plus optional free CFBD key) to pull live games, pitchers, EPA, and props.
      </div>
      <button class="btn on !py-1.5 text-xs" onclick="openCfg()">Configure Feeds</button>
    </div>` : '';

  const topSummary = topPicks.length ? `
    <div class="card p-4 mb-4 border-green-800/60 bg-[#0e1924]">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="font-bold text-sm uppercase tracking-wider text-green-400">🎯 Top Matchup Edges on the Board</h2>
        <span class="text-xs text-slate-400">Powered by Official League APIs, Pitcher Matchups & Efficiency</span>
      </div>
      <div class="grid sm:grid-cols-3 gap-2.5">
        ${topPicks.map(g => `
          <div class="p-3 rounded-lg bg-[#0b0f17] border border-slate-800 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-1 mb-1.5">
                <span class="tag ${g.rec.badges[0]?.cls || 't-green'}">${g.rec.badges[0]?.text || '🔥 Play'}</span>
                <span class="text-xs font-bold text-green-400">${g.rec.confidence}% Conf</span>
              </div>
              <div class="font-bold text-sm text-white mb-1">${g.rec.pickTitle.replace(/^PICK:\s*|^TAKE\s*/i, '')}</div>
              <div class="text-xs text-slate-400 line-clamp-2">${g.rec.reason}</div>
            </div>
            <button class="btn on !py-1 !px-2 text-xs mt-2.5 w-full !bg-green-700 hover:!bg-green-600" onclick="openSlip('${g.id}')">+ Log Play</button>
          </div>
        `).join('')}
      </div>
    </div>` : '';

  $('#main').innerHTML =
    banner +
    (st.err.length ? `<div class="card p-3 mb-3 border-red-800 bg-red-950/30 text-red-300 text-sm">${st.err.join('<br>')}</div>` : '') +
    topSummary +
    (gs.length ? gs.map(renderCard).join('') : '<div class="card p-8 text-center text-slate-400">No upcoming games match these filters.</div>');
}

      </div>

      ${showTel ? `
        <div class="mt-2.5 p-3 rounded-lg bg-[#0b0f17] border border-slate-800 grid sm:grid-cols-2 gap-3 text-xs">
          <div>
            <div class="font-bold text-slate-300 mb-1">${g.a} Leaders & Form</div>
            <div class="text-slate-400">${(e.a?.leaders || ['No leader data']).join(' · ')}</div>
            ${e.a?.standings?.l10 ? `<div class="text-slate-400 mt-1">Last 10 Games: <b class="text-slate-200">${e.a.standings.l10}</b></div>` : ''}
          </div>
          <div>
            <div class="font-bold text-slate-300 mb-1">${g.h} Leaders & Form</div>
            <div class="text-slate-400">${(e.h?.leaders || ['No leader data']).join(' · ')}</div>
            ${e.h?.standings?.l10 ? `<div class="text-slate-400 mt-1">Last 10 Games: <b class="text-slate-200">${e.h.standings.l10}</b></div>` : ''}
          </div>
        </div>
      ` : ''}

      ${showProps ? renderPropsDrawer(g) : ''}

      ${showOdds ? `
        <div class="mt-2.5 overflow-x-auto rounded-lg border border-slate-800">
          <table class="w-full">
            <tr class="bg-[#0b0f17] text-[11px] text-slate-400">
              <th class="text-left p-1.5">Book</th>
              <th class="p-1.5">Moneyline (Away / Home)</th>
              <th class="p-1.5">Home Spread</th>
              <th class="p-1.5">Game Total (O / U)</th>
            </tr>
            ${rows}
          </table>
        </div>
      ` : ''}
    </div>`;
}

function renderPropsDrawer(g) {
  if (st.propsLoading[g.id]) {
    return `<div class="mt-3 p-4 rounded-lg bg-[#0b0f17] border border-slate-800 text-xs text-slate-400 text-center">Fetching player props & checking injury reports…</div>`;
  }
  const pData = st.propsData[g.id];
  if (!pData) return '';
  if (pData.error) {
    return `<div class="mt-3 p-3 rounded-lg bg-red-950/30 border border-red-800 text-xs text-red-300">${pData.error}</div>`;
  }
  if (!pData.length) {
    return `<div class="mt-3 p-3 rounded-lg bg-[#0b0f17] border border-slate-800 text-xs text-slate-400">No player props posted yet for this game.</div>`;
  }

  const summary = st.summaryData[g.id];
  const injList = (summary?.injuries || []).filter(x => x.keyOut && x.keyOut.length);
  const injBanner = injList.length ? `
    <div class="mb-2.5 p-2 rounded bg-red-950/25 border border-red-900/50 text-xs text-red-200">
      <b>🏥 Injury Report (Out / Doubtful):</b> ${injList.map(x => `${x.teamName}: ${x.keyOut.slice(0, 4).join(', ')}`).join(' · ')}
    </div>` : '';

  const availableMarkets = ['ALL', ...new Set(pData.map(p => p.market))];
  const activeFilter = st.propFilter[g.id] || 'ALL';
  const filtered = activeFilter === 'ALL' ? pData : pData.filter(p => p.market === activeFilter);

  return `
    <div class="mt-3 p-3 rounded-lg bg-[#0b0f17] border border-slate-800">
      ${injBanner}
      <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
        <div class="flex flex-wrap gap-1">
          ${availableMarkets.map(m => `
            <button class="btn !py-1 !px-2 text-[11px] ${activeFilter === m ? 'on' : ''}" onclick="st.propFilter['${g.id}']='${m}';render()">
              ${m === 'ALL' ? 'All Props' : (PROP_LABELS[m] || m)}
            </button>
          `).join('')}
        </div>
        <span class="text-[11px] text-slate-500">Ranked by Matchup & Game-Script Fit</span>
      </div>

      <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
        ${filtered.slice(0, 20).map(p => {
          const mLabel = PROP_LABELS[p.market] || p.market;
          const propDesc = p.line != null ? `${p.player} ${p.side} ${p.line} ${mLabel}` : `${p.player} ${mLabel}`;
          const confColor = p.confidence >= 78 ? 'text-green-400' : p.confidence >= 68 ? 'text-blue-400' : 'text-slate-300';
          return `
            <div class="p-2.5 rounded-lg bg-[#121826] border border-slate-800/90 flex flex-wrap items-center justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
                  <span class="tag ${p.badge.cls}">${p.badge.text}</span>
                  <span class="font-bold text-sm text-white">${propDesc}</span>
                  <span class="text-xs font-bold ${confColor}">(${p.confidence}% Fit)</span>
                </div>
                <div class="text-xs text-slate-400">${p.reason}</div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <div class="text-right text-[11px] text-slate-400">
                  ${BK.filter(b => p.books[b] != null).map(b => `<span class="${b === p.bestBook ? 'text-green-400 font-bold' : ''}">${b}: ${fm(p.books[b])}</span>`).join(' · ')}
                </div>
                <button class="btn on !py-1 !px-2.5 text-xs !bg-green-700 hover:!bg-green-600" onclick="openCustomSlip('${g.id}', '${propDesc.replace(/'/g, "\\'")}', '${p.bestBook}', ${p.bestOdds}, '${p.reason.replace(/'/g, "\\'")}')">
                  + ${fm(p.bestOdds)}
                </button>
              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

/* ---------- LOG PICK DRAWER ---------- */
function openSlip(id) {
  const g = st.games.find(x => x.id === id);
  const rec = g?.rec;
  if (!rec?.bet) return;
  openCustomSlip(id, rec.bet.label, rec.bet.book, rec.bet.odds, rec.reason);
}

function openCustomSlip(gameId, label, book, odds, reason) {
  const g = st.games.find(x => x.id === gameId);
  if (!g) return;
  const fullLabel = label.includes(g.a) || label.includes(g.h) ? label : `${g.a} @ ${g.h} — ${label}`;

  st.slip = { sport: g.s, desc: `${fullLabel} [${book}]`, o: odds, reason };
  const el = $('#slip');
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="flex justify-between items-center mb-2">
      <b class="text-base">Log Play</b>
      <button class="text-slate-400 hover:text-white" onclick="$('#slip').classList.add('hidden')">✕</button>
    </div>
    <div class="p-2.5 rounded-lg bg-[#0b0f17] border border-slate-800 mb-3">
      <div class="font-bold text-sm text-green-400">${fullLabel}</div>
      <div class="text-xs text-slate-400 mt-0.5">${g.s} · ${fm(odds)} at ${book}</div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <div>
        <label class="text-xs text-slate-400">Odds</label>
        <input id="so" type="number" value="${odds}">
      </div>
      <div>
        <label class="text-xs text-slate-400">Bet Size (Units)</label>
        <select id="su">
          <option value="0.5">0.5u (Lean / Prop)</option>
          <option value="1" selected>1.0u (Standard)</option>
          <option value="2">2.0u (Strong Play)</option>
          <option value="3">3.0u (Max Play)</option>
        </select>
      </div>
    </div>

    <label class="text-xs text-slate-400 block mb-1">Matchup / Script Reason</label>
    <textarea id="snote" rows="3">${reason}</textarea>

    <button class="btn on w-full mt-3 !bg-green-600 hover:!bg-green-500 text-center" onclick="logBet()">Save to My Record</button>
    <p id="smsg" class="text-xs text-green-400 mt-2 text-center"></p>
  `;
}

function logBet() {
  const o = +$('#so').value;
  const u = +$('#su').value;
  const note = $('#snote').value.trim();
  if (!o || !u) return;

  st.bets.push({
    id: Date.now(),
    d: new Date().toISOString().slice(0, 10),
    s: st.slip.sport,
    desc: st.slip.desc,
    odds: o,
    units: u,
    note,
    st: 'pending'
  });
  W('gp_bets', st.bets);
  $('#smsg').textContent = 'Saved ✓';
  setTimeout(() => $('#slip').classList.add('hidden'), 800);
}

/* ---------- MY RECORD ---------- */
const unitPL = b => b.st === 'win' ? b.units * (dec(b.odds) - 1) : b.st === 'loss' ? -b.units : 0;

function setB(id, f, v) {
  const b = st.bets.find(x => x.id === id);
  b[f] = v;
  W('gp_bets', st.bets);
  rBets();
}

function delB(id) {
  st.bets = st.bets.filter(b => b.id !== id);
  W('gp_bets', st.bets);
  rBets();
}

function rBets() {
  const sett = st.bets.filter(b => b.st !== 'pending');
  const netU = sett.reduce((a, b) => a + unitPL(b), 0);
  const w = sett.filter(b => b.st === 'win').length;
  const l = sett.filter(b => b.st === 'loss').length;
  const uVal = st.cfg.unit || 25;

  const KPI = (lbl, val, cls = '') => `
    <div class="card p-3">
      <div class="text-xs text-slate-400">${lbl}</div>
      <div class="text-xl font-bold mt-0.5 ${cls}">${val}</div>
    </div>`;

  $('#main').innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
      ${KPI('Net Units', `${netU >= 0 ? '+' : ''}${netU.toFixed(2)}u`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Net Profit ($)', `${netU >= 0 ? '+' : '-'}$${Math.abs(netU * uVal).toFixed(0)}`, netU >= 0 ? 'text-green-400' : 'text-red-400')}
      ${KPI('Win Rate', w + l ? `${(w / (w + l) * 100).toFixed(1)}%` : '–')}
      ${KPI('Record', `${w}-${l}`)}
    </div>

    <div class="card p-3 mb-3"><canvas id="ch" height="75"></canvas></div>

    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <tr class="text-xs text-slate-400 text-left border-b border-slate-800">
          <th class="p-2.5">Date</th>
          <th>Sport</th>
          <th>Pick & Matchup Reason</th>
          <th>Odds</th>
          <th>Size</th>
          <th>Result</th>
          <th>P/L</th>
          <th></th>
        </tr>
        ${st.bets.slice().reverse().map(b => {
          const p = unitPL(b);
          return `
            <tr class="border-t border-slate-800/70">
              <td class="p-2.5 text-slate-400 text-xs whitespace-nowrap">${b.d}</td>
              <td><span class="tag t-blue">${b.s}</span></td>
              <td class="py-2 pr-2">
                <div class="font-semibold">${b.desc}</div>
                ${b.note ? `<div class="text-xs text-slate-400 mt-0.5">${b.note}</div>` : ''}
              </td>
              <td>${fm(b.odds)}</td>
              <td>${b.units}u</td>
              <td>
                <select class="!w-24 !py-1" onchange="setB(${b.id},'st',this.value)">
                  ${['pending', 'win', 'loss', 'push'].map(s => `<option ${b.st === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </td>
              <td class="font-semibold ${p > 0 ? 'text-green-400' : p < 0 ? 'text-red-400' : ''}">${p ? `${p > 0 ? '+' : ''}${p.toFixed(2)}u` : '–'}</td>
              <td><button class="text-slate-500 hover:text-red-400 px-2" onclick="delB(${b.id})">✕</button></td>
            </tr>`;
        }).join('') || '<tr><td colspan="8" class="p-6 text-center text-slate-400">No picks logged yet.</td></tr>'}
      </table>
    </div>`;

  const sp = Object.keys(SP);
  const data = sp.map(s => st.bets.filter(b => b.s === s && b.st !== 'pending').reduce((a, b) => a + unitPL(b), 0));
  if (chart) chart.destroy();
  chart = new Chart($('#ch'), {
    type: 'bar',
    data: {
      labels: sp,
      datasets: [{
        label: 'Units Won / Lost by Sport',
        data,
        backgroundColor: data.map(v => v >= 0 ? '#22c55e' : '#ef4444'),
        borderRadius: 6
      }]
    },
    options: {
      plugins: { legend: { labels: { color: '#e5e7eb' } } },
      scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
      }
    }
  });
}

/* ---------- SETTINGS ---------- */
function openCfg() {
  const c = st.cfg;
  const m = $('#modal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  m.innerHTML = `
    <div class="card p-5 w-full max-w-md border-slate-700">
      <h2 class="font-bold text-lg mb-3">SaaS Data Feeds & API Setup</h2>

      <label class="text-xs text-slate-400">The Odds API Key (Required for Live Lines & Props)</label>
      <input id="k" type="password" value="${c.key}" placeholder="Paste key from the-odds-api.com">

      <label class="text-xs text-slate-400 mt-3 block">CollegeFootballData API Key (Optional — Free SP+ & EPA)</label>
      <input id="cfk" type="password" value="${c.cfbdKey || ''}" placeholder="Free key from collegefootballdata.com">

      <div class="mt-3 p-2.5 rounded-lg bg-[#0b0f17] border border-slate-800 text-[11px] text-slate-400 space-y-1">
        <div>✅ <b>NHL Official API</b> (`api-web.nhle.com`): Auto-active (0 key needed)</div>
        <div>✅ <b>MLB Stats API</b> (`statsapi.mlb.com`): Auto-active (Probable Pitchers & ERA)</div>
        <div>✅ <b>nflverse Open Data</b> (`nflfastR`): Auto-active (Team Pass/Rush EPA)</div>
      </div>

      <p class="text-xs text-slate-400 mt-4 mb-1.5">Sports to Analyze</p>
      <div class="flex flex-wrap gap-3 text-sm mb-4">
        ${Object.keys(SP).map(s => `
          <label class="flex gap-1.5 items-center cursor-pointer">
            <input type="checkbox" class="!w-auto" id="on_${s}" ${c.on[s] ? 'checked' : ''}>${s}
          </label>
        `).join('')}
      </div>

      <div class="mb-4">
        <label class="text-xs text-slate-400">1 Unit Value ($)</label>
        <input id="un" type="number" value="${c.unit}">
      </div>

      <div class="flex gap-2 justify-end">
        <button class="btn" onclick="closeCfg()">Cancel</button>
        <button class="btn on" onclick="saveCfg()">Save & Sync Feeds</button>
      </div>
    </div>`;
}

function closeCfg() {
  $('#modal').classList.add('hidden');
  $('#modal').classList.remove('flex');
}

function saveCfg() {
  const on = {};
  Object.keys(SP).forEach(s => on[s] = $('#on_' + s).checked ? 1 : 0);
  st.cfg = {
    key: $('#k').value.trim(),
    cfbdKey: $('#cfk').value.trim(),
    on,
    unit: +$('#un').value || 25
  };
  W('gp_cfg', st.cfg);
  closeCfg();
  load(true);
}

load();
</script>
</body>
</html>
